# gitleaks configuration for the history scan of .github/workflows/security.yml (SEC-084).
#
# The default ruleset applies to everything. The only paths exempt from it hold synthetic secrets that exist to
# test redaction, scanners and validators; nothing in them is a credential for any system. The in-tree scan
# (tests/security/secrets TestSecRepoSecretScan) still reads these files and requires a real-looking key to
# carry a TEST-ONLY marker in its own content.
title = "AlixAI gitleaks"

[extend]
useDefault = true

[[allowlists]]
description = "synthetic secrets in tests, fixtures and the published test-only key"
paths = [
  '''_test\.go$''',
  '''(^|/)testdata/''',
  '''^tools/devkeys/test-only-publisher\.key\.pem$''',
  '''^schemas/.+/examples/.+/invalid/''',
  '''^tests/performance/rag/corpus\.json$''',
]

# Narrow allowlists for generic-api-key false positives that are not under the path exemptions above.
# Each entry is path AND the exact fixture / published value; the rule itself stays enabled.

[[allowlists]]
description = "pinned release Ed25519 public key, published on purpose (internal/release/keys.go)"
condition = "AND"
paths = ['''^internal/release/keys\.go$''']
regexes = ['''ok5oQ98ihECPbbWYuXWyfAlVbK6kZV97vQliBsYfzOU=''']

[[allowlists]]
description = "fake provider API key in the Python SDK provider tests"
condition = "AND"
paths = ['''^sdk/python/tests/test_providers\.py$''']
regexes = ['''sk-test-0123456789abcdef-NEVER-ECHO''']

[[allowlists]]
description = "fake provider API key in the TypeScript SDK provider tests"
condition = "AND"
paths = ['''^sdk/typescript/test/providers\.test\.ts$''']
regexes = ['''sk-test-0123456789abcdef-NEVER-ECHO''']
