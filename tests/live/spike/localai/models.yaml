# Failure fixtures for TestSpikeErrorMapping (error mapping and HC-20). They are listed by /v1/models, so the adapter's
# health check passes, and fail only when a request reaches the backend.
# m0-corrupt: the file is not a GGUF model (created by the test setup, never downloaded), so the backend cannot load it.
- name: m0-corrupt
  backend: llama-cpp
  context_size: 2048
  known_usecases:
    - chat
  parameters:
    model: m0-corrupt.gguf
    temperature: 0
# m0-tinyctx: a valid model with a 256-token window, smaller than the gateway's own prompt, so a request overflows
# the context window. It reuses the Granite 350M file already on disk.
- name: m0-tinyctx
  backend: llama-cpp
  context_size: 256
  known_usecases:
    - chat
  options:
    - use_jinja:true
  parameters:
    model: granite-4.0-350m-Q4_K_M.gguf
    temperature: 0
  template:
    use_tokenizer_template: true
# m0-oom: Granite 4.0 1B with its full 131072-token window. The KV cache alone is larger than the 4 GB profile's cap, so
# loading it under compose.4g.yaml makes the cgroup kill the backend: the failure an out-of-memory machine produces.
- name: m0-oom
  backend: llama-cpp
  context_size: 131072
  known_usecases:
    - chat
  options:
    - use_jinja:true
  parameters:
    model: granite-4.0-1b-Q4_K_M.gguf
    temperature: 0
  template:
    use_tokenizer_template: true
