# M0-13 spike model definitions, mounted over /configuration/models.yaml by compose.spike.yaml.
#
# One LocalAI model per registry entry, named by the registry id so `tools/bench --model <id>` needs no
# --localai-model. Every URL is commit-pinned and every file carries the sha256 the model registry
# (models/registry) pins; LocalAI's own preload downloads and verifies them (hardening.md section 4).
# alixai-smoke is kept unchanged from deploy/container/localai/config/models.yaml so smoke.sh still works.
#
# context_size is 4096 for every controller: the bench prompt budget is 4096 estimated tokens (one token per three
# bytes, an overestimate) plus up to 512 output tokens, and the Lite KV budget must stay small (the Qwen3.5 native
# window is 262144). Qwen3.5 thinking is switched off two ways (reasoning.disable and the enable_thinking template
# keyword); the evidence checks the raw outputs for a think tag.
- name: alixai-smoke
  backend: llama-cpp
  context_size: 2048
  known_usecases:
    - chat
  options:
    - use_jinja:true
  parameters:
    model: granite-4.0-350m-Q4_K_M.gguf
    temperature: 0
  template:
    use_tokenizer_template: true
  download_files:
    - filename: granite-4.0-350m-Q4_K_M.gguf
      uri: https://huggingface.co/ibm-granite/granite-4.0-350m-GGUF/resolve/b8208a86a58427e1739265318028eb5895b74bf2/granite-4.0-350m-Q4_K_M.gguf
      sha256: 771c588a49607f274a2bba3185733607ebe6f74b996ab90e2d6bee0d98bcec52

