notes:
  - "UNLOADABLE under the pinned runtime (checked 2026-10-08, M9-05). The GGUF declares general.architecture = gemma-embedding2 (header read from the pinned file; hub metadata agrees). LocalAI v4.10.0 builds llama.cpp commit 38a5b42d9a3e82e0a586bcd1caed121f36c87a73 (2026-09-15, backend/cpp/llama-cpp/Makefile at tag v4.10.0), whose src/llama-arch.cpp has gemma-embedding but no gemma-embedding2. Support landed upstream in llama.cpp PR #30054 'model: support embeddinggemma2 (text+vision+audio)', merged 2026-10-06T16:20:31Z. LocalAI v4.11.0 (published 2026-10-02) pins a868c3e3 (2026-10-01) and LocalAI master pins bed0a856 (2026-10-02): both also lack the architecture. allowed_runtime_versions is therefore empty (fail closed). Nothing was loaded or benchmarked."
  - "Upstream card facts (fetched 2026-10-08, revision 914f7f89, created 2026-09-14): Apache-2.0, not gated, 740M parameters in total (130M backbone + 140M embedder = about 270M text part, plus 170M vision and 300M audio encoders), 768 dimensions (512 to 768 projection) with Matryoshka truncation to 512, 256 and 128, 8192-token window, 100+ languages (pretraining data over 140), MTEB multilingual v2 mean 61.36 and English v2 mean 68.46 as reported by Google (a vendor claim, not an AlixAI measurement). The Q8_0 text-only GGUF has 271,002,648 parameters; the mmproj files in the same repository are the vision and audio parts and are not needed for text embeddings."
  - "Artefact is third party: ggml-org (ggml-org/embeddinggemma-2-GGUF, created 2026-10-06, 'automatically converted'). The hash is the hub LFS oid at the pinned commit and was not re-hashed locally because the file was not downloaded in full. Other conversions exist (unsloth, prithivMLmods, ngquocvinh) and an ONNX export (onnx-community/embeddinggemma-2-ONNX); none changes the runtime verdict. The pinned llama.cpp-based runtime cannot load any of them."
  - "Re-evaluate when a LocalAI release pins a llama.cpp at or after PR #30054 (merge commit 4fbc76dec51d0add466f0210855c0596589b60d4), then run the M0-13 style qualification and the M2 EN/IT corpus against Granite Embedding 97M (docs/evidence/m9-embedding/verdict.md). Until then this stays a candidate and nothing defaults to it."
