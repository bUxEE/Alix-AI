notes:
  - "Hub facts confirmed 2026-10-02 against huggingface.co: repository, file name, size, commit and the file's LFS sha256 (the hub's X-Linked-ETag header and its file tree agree). The hash is the hub's published value at the pinned commit; M0-13 re-hashes the downloaded file locally."
  - "IBM publishes no GGUF for this model: the official repository ships safetensors, ONNX (including onnx/model_quint8_avx2.onnx, 98247878 bytes) and OpenVINO files, and its card only shows how to convert it to GGUF yourself with llama.cpp's convert_hf_to_gguf.py. The artefact is a third-party conversion by mykor. The BF16 and Q4_K_M files in the xnohat/granite-embedding-97m-multilingual-r2-GGUF repository have the same sha256 as mykor's, which corroborates the conversion but is not an IBM attestation. A locally produced conversion is the alternative if the third-party link is not accepted."
  - "Q4-class quantisation of a 97M encoder saves little: the same repository's Q8_0 file (granite-embedding-97M-multilingual-r2-Q8_0.gguf, 115061088 bytes, sha256 25155b89638e501ac33495fa278d551d7545e1e2f62722a499bba1f064c080f2) is only about 10 MB larger. M0-13 should compare retrieval quality of Q4_K_M and Q8_0 before this entry is qualified. The publisher reports a cosine similarity of 0.99996 between its BF16 GGUF and the reference model on one sample; that is not an AlixAI measurement and does not cover Q4_K_M."
  - "Upstream card (released 2026-04-29): 97M parameters, 384-dimension vectors, up to 32768 input tokens, ModernBERT architecture, 200+ languages with enhanced support for the 52 listed in languages.declared (Italian and English included). The card says Ollama does not support ModernBERT models; the pinned LocalAI v4.10.0 llama-cpp backend DOES load this modern-bert GGUF (M0-13, docs/evidence/m0-spike/embedding.json)."
  - "Default embedding model for Lite and Balanced per master plan 8.2 ('same or qualified larger replacement' for Balanced)."
  - "M0-13 verdict (2026-10-02, emulated lite): QUALIFIED-EMULATED. Bar written before the run (docs/evidence/m0-spike/report.md): loads under the pinned backend, 384 finite dimensions, mean recall@1 at least 0.90 over the four synthetic sets, within 0.05 of the Q8_0 file. Measured: Q4_K_M mean recall@1 0.9 (MRR 0.931; en_to_en 1, it_to_it 0.8, en_to_it 0.8, it_to_en 1), Q8_0 0.85 (MRR 0.906); cosine between the Q4_K_M and Q8_0 vectors of the same text 0.997 on average, 0.995 at worst. Q4_K_M is not worse than Q8_0 here, so the smaller file stays the default. This is a 20-queries-per-language synthetic set with 18 passages in each pool: it shows no gross failure, it cannot rank two close models and it is not a retrieval-quality certification. languages.qualified stays empty: Italian-to-Italian recall@1 was 0.8, below the 0.9 the whole-set bar asked for, and no per-language bar was written."
  - "M0-13 measured (lite profile = 8192 MiB / 4 CPU container cap, i7-10700K host, no GPU; emulated, never certified; LocalAI v4.10.0, llama-cpp, context 512): single-text request latency p50 75 ms and p95 183 ms over 30 requests; first request after container start 7267 ms (backend start, model load, one embedding; load_time.cold_ms); resident set 390 MiB peak, 386 MiB median (anonymous 189 MiB peak; file-backed pages of the mapped weights included), 6 samples (docs/evidence/m0-spike/embedding-footprint.json). Tokens per second, KV cache and warm load time were not measured. The artefact was re-hashed locally with models.HashFile and matches the pin (docs/evidence/m0-spike/model-hashes.json)."
