notes:
  - "Candidate pack named by ADR 0015, measured by M4-06 (docs/evidence/m4-voice/report.md, pre-registered gates in protocol.md, emulated lite profile: 8 GiB, 4 CPU, LocalAI v4.10.0, three cold-start runs per candidate). Status stays candidate: no complete Lite voice stack passes in English."
  - "STT: whisper tiny is the smallest rung that passes every STT gate (FLEURS en WER 0.138 against the 0.15 bar, a thin margin on 857 reference words; base would give 0.104 and also passes every gate; both fit the 500 MiB worker budget). The pack moved from base to tiny by the smallest-passing rule; base is the quality step for an operator who wants it. Whisper alone transcribes silence and noise into text (4 of 4 non-speech clips in each language, every size): the VAD in front of it is mandatory, and the VAD passed 8 of 8 non-speech clips with no speech segment."
  - "TTS: Piper ljspeech medium fails the Lite gates for time to first audio (median 2292 ms against 1500; LocalAI v4.10.0 returns a complete file, the stream request hangs, so the adapter must use tts_no_stream) and for the worker resident set (peak 644 MiB against 300). Round-trip WER 0.070 and real-time factor 0.629 pass. Kokoro v1.0 (kokoros backend) was measured as the challenger and fails the same two gates (796 MiB peak, 1892 ms streamed). On Lite the text answer is returned without audio (master plan 18)."
  - "resources.* are the sums of the three workers measured one at a time (largest peak of three runs, median steady): an upper bound for the pack active; the Lite co-residency run with whisper tiny, Piper ljspeech and the VAD beside the Granite 1B controller and embedder peaked at 3012 MiB in total with LOCALAI_MAX_ACTIVE_BACKENDS=5 and showed no reload (8 reloads at the shipped default of 2)."
  - "Pins re-verified 2026-10-04 by M4-06: every file was downloaded host-side and its sha256 matches the pin. The Silero file is the ggml model that LocalAI v4.10.0 serves through the whisper.cpp backend (gallery entry silero-vad-ggml, option vad_only); the silero-vad ONNX backend would need a different file. Licences are recorded as found and are not reviewed here (M5-H02)."
