notes:
  - "Candidate STT-only pack (ADR 0040). Opt-in until voicebench on real LocalAI clears the Balanced STT gates (docs/evidence/m4-voice/protocol.md). Never a default while status is candidate."
  - "Languages (NVIDIA card, 25 European): bg, hr, cs, da, nl, en, et, fi, fr, de, el, hu, it, lv, lt, mt, pl, pt, ro, ru, sk, sl, es, sv, uk. Schema language is mul (one tag per pack)."
  - "LocalAI declares the backend as parakeet-cpp (backend: parakeet-cpp, parameters.model: the GGUF file name). Engine field here is parakeet.cpp, matching ADR 0015. Runs on CPU via ggml; GPU (CUDA/Metal/Vulkan) is optional — not NVIDIA-hardware-required (parakeet.cpp README). Pinned LocalAI v4.10.0 ships this backend; install from deploy/container/localai/stt-only/backend-gallery.yaml (and the voicebench stack gallery)."
  - "Q4_K is the smallest LocalAI-oriented quant in mudler/parakeet-cpp-gguf for this model (~675 MB). NVIDIA also publishes a first-party Q8_0 GGUF (parakeet-tdt-0.6b-v3.q8_0.gguf, 713975456 bytes, sha256 e3880d0aaaaf2c308ea2c35016b2b895c423eb3fda924c1b463d1c19b7f4d32e at nvidia/parakeet-tdt-0.6b-v3). Third-party Q4_K_M files (~485 MB) exist elsewhere; this pack pins the LocalAI gallery conversion only."
  - "PROFILE DEFAULTS (shipped state): Lite keeps en-stt (Whisper tiny). Balanced and Performance do NOT default to this pack while it is candidate. ONE-LINE FLIP after a passing voicebench run: change this pack's status to qualified-emulated and set the deployment voice.active_pack (or operator install target) to parakeet-stt for Balanced/Performance; leave Lite on en-stt. Documented in ADR 0040."
  - "Dictation: no VAD role in this pack (user-segmented clips). Conversation mode: keep Silero VAD in front of STT (ADR 0015); install a pack or overlay that provides VAD, or pair this STT with the VAD from en-stt / en / it."
