notes:
  - "The one voice capability the Lite profile may offer (M4-06, docs/evidence/m4-voice/report.md): speech input in English, the answer stays text (STT-only pack). Whisper tiny clears every STT gate on FLEURS English (WER 0.138 against 0.15, real-time factor 0.09, worker peak 202 MiB against 500) and the VAD clears its three gates (no speech segment in 8 of 8 non-speech clips, speech in 80 of 80 FLEURS clips, 41 MiB). Emulated lite profile (8 GiB, 4 CPU), LocalAI v4.10.0, three cold-start runs per candidate; never a certification."
  - "The VAD is mandatory in front of the STT: Whisper alone turned all 8 silence and noise clips into text. Install needs LOCALAI_MAX_ACTIVE_BACKENDS of at least 4 in total (controller, embedder, STT, VAD; STT and VAD are two processes of the whisper.cpp backend). The 4 is derived: the measured co-residency run had 5 slots with a TTS worker. At the shipped Lite default of 2 each voice call evicts the controller (8 reloads in 21 calls measured)."
  - "resources.* are the sums of the two workers measured separately (largest peak of three runs, median steady). The margin on the WER bar is thin (857 reference words); the en pack carries the same model, and whisper base (WER 0.104, 230 MiB) is the quality step. Licences and pins are those of the en pack; recorded as found, the sign-off is the M5-H02 human licence review."
