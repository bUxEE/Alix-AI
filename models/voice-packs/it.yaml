notes:
  - "Candidate pack named by ADR 0015, measured by M4-06 (docs/evidence/m4-voice/report.md, pre-registered gates in protocol.md, emulated lite profile: 8 GiB, 4 CPU, LocalAI v4.10.0, three cold-start runs per candidate). Status stays candidate: Italian voice is Balanced-only."
  - "STT: on FLEURS Italian whisper tiny gives WER 0.299 and base 0.197, both over the 0.15 bar; whisper small gives 0.083 and real-time factor 0.47 but its worker peaks at 550 MiB against the 500 MiB Lite budget (steady 394 MiB), so Italian speech to text needs the Balanced profile (budget 1000 MiB). The pack therefore carries small. Whisper alone transcribes silence and noise into text (4 of 4 non-speech clips, every size): the VAD in front of it is mandatory and passed 8 of 8."
  - "TTS: Piper paola medium fails three Lite gates: round-trip WER 0.153 against 0.10 (many of the edits are the judge writing digits for spelled-out numbers, which the pre-registered normaliser counts as errors; the failure does not depend on that), time to first audio median 2029 ms against 1500 (complete file, no streaming) and worker peak 576 MiB against 300. The smaller it_IT riccardo x_low voice meets the latency gate (1422 ms) but misses intelligibility (WER 0.164, real mishearings) and memory (354 MiB). Italian TTS at Lite size is not available; the Italian shelf is shallow."
  - "The paola voice was fine-tuned from the U.S. English lessac voice, whose dataset is under the Blizzard 2013 licence (not reviewed or decided by M4-06): listed for M5-H02, together with the GPL-3.0 Piper engine."
  - "resources.* are the sums of the three workers measured one at a time (largest peak of three runs, median steady): an upper bound for the pack active. Pins re-verified 2026-10-04: every file was downloaded host-side and its sha256 matches the pin; the VAD file is served through the whisper.cpp backend (vad_only), see the en pack."
