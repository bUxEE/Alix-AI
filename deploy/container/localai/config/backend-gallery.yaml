# Pinned backend catalogue. LocalAI reads it through LOCALAI_BACKEND_GALLERIES (file:// URL) and
# installs the names listed in LOCALAI_EXTERNAL_BACKENDS at first boot into /backends. It is the
# only backend gallery configured, so nothing else can be resolved or installed.
