# Backends are OCI images referenced by digest: content-addressed, immutable, and independent of
# the mutable "latest-*" tags the upstream index uses. LocalAI's tag-fallback rewrite only
# triggers on a "latest-" tag, so a digest reference is never silently replaced.
#
