# index d7b0d9c6...; amd64 9d6b85ce..., arm64 c01fdd73.... Same digest on quay.io and Docker Hub.
#
# To add a backend: resolve its digest from the registry (README.md "Adding a model or backend"),
# add an entry here, append its name to LOCALAI_EXTERNAL_BACKENDS in .env.
