# OPT-IN (the Quadlet counterpart of ../../../stack/compose.external.yaml): joins the pod, the network namespace
# AlixAI runs in, to a network with a route out. LocalAI is not in the pod and gets no route out.
#
# Podman cannot filter by host name any more than Docker can: this opens the network layer for the AlixAI process
# and nothing narrower. "Only the configured provider hosts" is enforced by AlixAI (internal/egress dials only exact
# host:port entries of its allowlist); add host firewall rules for the provider addresses if you want it twice.
#
# Enabling it makes the deployment network-dependent and subject to the providers' terms of service, data handling
# and availability. Prompts that the data-egress policy allows leave the machine.
[Pod]
Network=alixai-egress.network
