# Lite profile (master plan 7.1): the caps of deploy/container/localai/compose.lite.yaml on the LocalAI container.
# Anything measured under it is labelled emulated, never certified. Needs `systemctl --user` with the memory and
# cpu controllers delegated to the user (README.md).
[Container]
PodmanArgs=--memory=8g --memory-swap=8g --cpus=4
Environment=LOCALAI_THREADS=4
Environment=LOCALAI_MAX_ACTIVE_BACKENDS=2
Label=ai.alixai.profile=lite
Label=ai.alixai.evidence=emulated
