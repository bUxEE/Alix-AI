# Experimental 4 GB profile (master plan 7.1): the caps of deploy/container/localai/compose.4g.yaml on the LocalAI
# container. One resident backend, the controller. An aspiration until the full workload passes its gates:
# anything measured under it is labelled emulated, never certified.
[Container]
PodmanArgs=--memory=4g --memory-swap=4g --cpus=4
Environment=LOCALAI_THREADS=4
Environment=LOCALAI_MAX_ACTIVE_BACKENDS=1
Label=ai.alixai.profile=4g
Label=ai.alixai.evidence=emulated
