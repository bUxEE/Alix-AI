# Balanced profile (master plan 7.2): the caps of deploy/container/localai/compose.balanced.yaml on the LocalAI
# container. Four resident backends. Anything measured under it is labelled emulated, never certified.
[Container]
PodmanArgs=--memory=16g --memory-swap=16g --cpus=8
Environment=LOCALAI_THREADS=8
Environment=LOCALAI_MAX_ACTIVE_BACKENDS=4
Label=ai.alixai.profile=balanced
Label=ai.alixai.evidence=emulated
