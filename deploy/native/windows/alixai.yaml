# AlixAI configuration for the native Windows service, read from C:\ProgramData\AlixAI\alixai.yaml.
# Every key can also be set by an ALIXAI_<SECTION>_<FIELD> environment variable. Nothing secret lives here.
# Paths are absolute: a service starts in C:\Windows\System32, so a relative data_dir would land there.

# The ACL of this directory is restricted to the service identity (../README.md, SEC-081).
data_dir: 'C:\ProgramData\AlixAI\data'

server:
  # Loopback only. The gateway refuses any other address without TLS (SEC-093); a remote listener is a
  # reverse proxy on the host that terminates TLS and forwards here.
  listen: 127.0.0.1:7470

log:
  level: info

# Context budgets and limits of the deployment profile: lite, balanced or performance.
profile: lite

localai:
  # A container published on the host loopback (Docker Desktop, Podman) or a supervised LocalAI process.
  endpoint: http://127.0.0.1:8080
  # The ACL of this file grants read to the service identity and Administrators only.
  api_key_ref: 'file:C:\ProgramData\AlixAI\localai-api-key'
  # A LocalAI version AlixAI was not qualified against is reported unavailable (SEC-072).
  qualified_versions: ["v4.10.0"]

inference:
  # Provisioned by the operator, read-only to the service. AlixAI verifies every listed model file against the
  # pinned hash of its registry entry before it serves a request (SEC-063).
  models_dir: 'C:\ProgramData\AlixAI\models'
  # Empty keeps the inference path off: the service starts, /healthz answers and /readyz says why.
  models: []
