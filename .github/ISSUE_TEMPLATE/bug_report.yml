name: Bug report
description: Something does not work as documented.
title: "[bug] "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        **Security vulnerabilities do not belong here.** If this could let an attacker bypass
        permissions, cross a tenant boundary, forge a receipt or leak data, stop and follow
        `SECURITY.md` instead. Never paste secrets, tokens or private data into an issue.
  - type: textarea
    id: summary
    attributes:
      label: What happened
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: A minimal sequence, request or test that shows the problem.
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Output of `alixai version`, or the commit hash you built from.
    validations:
      required: true
  - type: dropdown
    id: profile
    attributes:
      label: Deployment profile
      options:
        - lite (8 GB / 4 CPU)
        - balanced (16 GB / 8 CPU)
        - experimental-4g (4 GB / 4 CPU)
        - other or not applicable
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Operating system and architecture
      placeholder: Ubuntu 24.04 x86-64, native binary
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Redact anything private. AlixAI logs go through a redaction helper, but check anyway.
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and did not find a duplicate.
          required: true
        - label: This is not a security vulnerability, and it contains no secrets or private data.
          required: true
