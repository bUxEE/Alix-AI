# AlixAI release pipeline (M5-03; supply chain and release gates). Docs: docs/operations/release.md, docs/release-gates.md.
#
# What it does, in order, for a version tag:
#   1. prepare      the version, commit and commit time, taken from the tag (the pipeline only runs on a tag)
#   2. reproducible `release reproducible-check`: every release target built twice from clean copies, hashes compared
#   3. binaries     GoReleaser builds the archives twice and the checksum files must be identical, then one CycloneDX SBOM per binary
#   4. image        the service and netctl images are built, pushed by digest, SIGNED WITH COSIGN (keyless) and the image SBOM is
#                   attached as a cosign attestation
#   5. manifest     the UNSIGNED release manifest: artifacts, images, backends, models and their licences
#   6. draft        a DRAFT GitHub release holding everything, behind the `release` environment (required reviewers)
#
# What it deliberately does not do: sign the release manifest. The manifest signature is an Ed25519 signature made with the offline
# release key (SEC-090: signing keys are held offline, M5-H02). The key holder downloads release-manifest.json from the draft, runs
# `go run ./tools/release sign`, uploads the signed file and publishes by hand. No signing key, no secret other than the job's own
# GITHUB_TOKEN exists in this workflow.
#
# Rules this file lives by (the same as ci.yml): every action is pinned by full commit SHA with its version in a trailing comment;
# `contents: read` by default and wider permissions only on the job that needs them; Go is pure Go (CGO_ENABLED=0); no telemetry.
# Cosign keyless signing talks to the public Sigstore services (Fulcio, Rekor); that is a build-time step on a CI runner and never
# part of the product.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CGO_ENABLED: "0"

jobs:
  prepare:
    name: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.meta.outputs.version }}
      commit: ${{ steps.meta.outputs.commit }}
      created_at: ${{ steps.meta.outputs.created_at }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Version, commit and commit time
        id: meta
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$REF_TYPE" != "tag" ]; then
            echo "::error::the release pipeline runs on a version tag (vX.Y.Z), not on '$REF_NAME'"
            exit 1
          fi
          version="${REF_NAME#v}"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::'$REF_NAME' is not a semantic version tag"
            exit 1
          fi
          created_at="$(date -u -d "@$(git show -s --format=%ct "$COMMIT")" +%Y-%m-%dT%H:%M:%SZ)"
          {
            echo "version=$version"
            echo "commit=$COMMIT"
            echo "created_at=$created_at"
          } >> "$GITHUB_OUTPUT"

  reproducible:
    name: reproducible builds
    needs: [prepare]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go (version from go.mod)
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # No restored module or build cache: the CI workflows run third-party tools that could write to a shared cache, and a
          # release is built only from what go.sum verifies.
          cache: false

      - name: Keep Go toolchain telemetry off
        run: go telemetry off

      - name: Verify module checksums and fill the module cache
        run: |
          go mod verify
          go mod download

      - name: Build every release target twice and compare
        # Each build gets its own copy of the source and an empty build cache, with GOPROXY=off: the second half of the
        # check is that nothing needs the network once the module cache is filled.
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          COMMIT: ${{ needs.prepare.outputs.commit }}
          CREATED_AT: ${{ needs.prepare.outputs.created_at }}
        run: |
          go run ./tools/release reproducible-check \
            -package ./cmd/alixai \
            -target linux/amd64 -target linux/arm64 -target windows/amd64 -target darwin/arm64 \
            -version "$VERSION" -commit "$COMMIT" -date "$CREATED_AT"
          go run ./tools/release reproducible-check \
            -package ./cmd/alixai-parser \
            -target linux/amd64 -target linux/arm64 -target windows/amd64 -target darwin/arm64 \
            -version "$VERSION" -commit "$COMMIT" -date "$CREATED_AT"
          go run ./tools/release reproducible-check \
            -package ./deploy/container/alixai/netctl \
            -include deploy/container/alixai/netctl \
            -target linux/amd64

  binaries:
    name: binaries and SBOMs
    needs: [prepare, reproducible]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go (version from go.mod)
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # No restored module or build cache: the CI workflows run third-party tools that could write to a shared cache, and a
          # release is built only from what go.sum verifies.
          cache: false

      - name: Keep Go toolchain telemetry off
        run: go telemetry off

      - name: Install GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.18.3 # exact: the tool that builds the shipped archives does not float
          install-only: true

      - name: Build the archives twice, nothing published
        # .goreleaser.yaml (M5-02) has release.disable, and --skip=publish says it again. The archives carry the commit's own
        # timestamp, so two runs must give the same checksum file.
        run: |
          set -euo pipefail
          goreleaser release --clean --skip=publish
          cp -r dist "$RUNNER_TEMP/dist-first"
          goreleaser release --clean --skip=publish
          if ! diff -u "$RUNNER_TEMP/dist-first/SHA256SUMS" dist/SHA256SUMS; then
            echo "::error::two GoReleaser runs produced different archives"
            exit 1
          fi

      - name: Collect the release files and write one SBOM per binary
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/release"
          mkdir -p "$out" "$RUNNER_TEMP/extract"
          cp dist/SHA256SUMS "$out/"
          for archive in dist/alixai_"$VERSION"_*.tar.gz dist/alixai_"$VERSION"_*.zip; do
            [ -f "$archive" ] || continue
            base="$(basename "$archive")"
            stem="${base%.tar.gz}"
            stem="${stem%.zip}"
            target="${stem#alixai_"$VERSION"_}"
            dir="$RUNNER_TEMP/extract/$target"
            mkdir -p "$dir"
            ext=""
            case "$archive" in
              *.tar.gz) tar -xzf "$archive" -C "$dir" alixai alixai-parser ;;
              *.zip) unzip -q "$archive" alixai.exe alixai-parser.exe -d "$dir"; ext=".exe" ;;
            esac
            cp "$archive" "$out/"
            cp "$dir/alixai$ext" "$out/alixai_${target}${ext}"
            cp "$dir/alixai-parser$ext" "$out/alixai-parser_${target}${ext}"
            go run ./tools/release sbom binary \
              -in "$out/alixai_${target}${ext}" -name alixai -version "$VERSION" \
              -out "$out/alixai_${target}.cdx.json"
            go run ./tools/release sbom binary \
              -in "$out/alixai-parser_${target}${ext}" -name alixai-parser -version "$VERSION" \
              -out "$out/alixai-parser_${target}.cdx.json"
          done
          ls -l "$out"

      - name: Upload the release files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: ${{ runner.temp }}/release
          if-no-files-found: error

  image:
    name: container images
    needs: [prepare, reproducible]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write # push to ghcr.io with the job's GITHUB_TOKEN
      id-token: write # keyless cosign signing: the OIDC identity of this workflow is the signing identity
    outputs:
      alixai_ref: ${{ steps.push.outputs.alixai_ref }}
      alixai_digest: ${{ steps.push.outputs.alixai_digest }}
      netctl_ref: ${{ steps.push.outputs.netctl_ref }}
      netctl_digest: ${{ steps.push.outputs.netctl_digest }}
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      COMMIT: ${{ needs.prepare.outputs.commit }}
      CREATED_AT: ${{ needs.prepare.outputs.created_at }}
      OWNER: ${{ github.repository_owner }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go (version from go.mod)
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # No restored module or build cache: the CI workflows run third-party tools that could write to a shared cache, and a
          # release is built only from what go.sum verifies.
          cache: false

      - name: Keep Go toolchain telemetry off
        run: go telemetry off

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Log in to ghcr.io
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}
        run: printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u "$REGISTRY_USER" --password-stdin

      - name: Build and push the images
        id: push
        # The Dockerfile (M5-01) pins both base images by digest and builds with -trimpath. The pushed digest, not the tag,
        # is what is signed, attested and listed in the release manifest.
        run: |
          set -euo pipefail
          owner="$(printf '%s' "$OWNER" | tr '[:upper:]' '[:lower:]')"
          alixai="ghcr.io/$owner/alixai"
          netctl="ghcr.io/$owner/alixai-netctl"
          for target in alixai netctl; do
            if [ "$target" = alixai ]; then repo="$alixai"; else repo="$netctl"; fi
            docker build -f deploy/container/alixai/Dockerfile --target "$target" \
              --build-arg "VERSION=$VERSION" --build-arg "COMMIT=$COMMIT" --build-arg "BUILD_DATE=$CREATED_AT" \
              -t "$repo:$VERSION" .
            docker push "$repo:$VERSION"
            digest="$(docker inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "$repo:$VERSION" | grep "^$repo@" | head -n 1 | sed 's/^.*@//')"
            if ! printf '%s' "$digest" | grep -Eq '^sha256:[0-9a-f]{64}$'; then
              echo "::error::no digest for $repo:$VERSION after the push"
              exit 1
            fi
            {
              echo "${target}_ref=$repo:$VERSION"
              echo "${target}_digest=$digest"
            } >> "$GITHUB_OUTPUT"
          done

      - name: SBOM of each image, from the binaries inside it
        env:
          ALIXAI_REF: ${{ steps.push.outputs.alixai_ref }}
          ALIXAI_DIGEST: ${{ steps.push.outputs.alixai_digest }}
          NETCTL_REF: ${{ steps.push.outputs.netctl_ref }}
          NETCTL_DIGEST: ${{ steps.push.outputs.netctl_digest }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/image-sboms"
          bins="$RUNNER_TEMP/image-bins"
          mkdir -p "$out" "$bins"
          cid="$(docker create "$ALIXAI_REF")"
          docker cp "$cid:/usr/local/bin/alixai" "$bins/alixai"
          docker cp "$cid:/usr/local/bin/alixai-parser" "$bins/alixai-parser"
          docker cp "$cid:/usr/local/bin/alixai-netctl" "$bins/alixai-netctl"
          docker rm "$cid" > /dev/null
          go run ./tools/release sbom image \
            -name alixai -reference "${ALIXAI_REF%:*}" -digest "$ALIXAI_DIGEST" -version "$VERSION" \
            -binary alixai="$bins/alixai" -binary alixai-parser="$bins/alixai-parser" -binary alixai-netctl="$bins/alixai-netctl" \
            -out "$out/alixai-image.cdx.json"
          go run ./tools/release sbom image \
            -name alixai-netctl -reference "${NETCTL_REF%:*}" -digest "$NETCTL_DIGEST" -version "$VERSION" \
            -binary alixai-netctl="$bins/alixai-netctl" \
            -out "$out/alixai-netctl-image.cdx.json"

      - name: Sign the images with cosign and attach the SBOMs as attestations
        env:
          ALIXAI_REF: ${{ steps.push.outputs.alixai_ref }}
          ALIXAI_DIGEST: ${{ steps.push.outputs.alixai_digest }}
          NETCTL_REF: ${{ steps.push.outputs.netctl_ref }}
          NETCTL_DIGEST: ${{ steps.push.outputs.netctl_digest }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/image-sboms"
          alixai="${ALIXAI_REF%:*}@$ALIXAI_DIGEST"
          netctl="${NETCTL_REF%:*}@$NETCTL_DIGEST"
          cosign sign --yes "$alixai"
          cosign sign --yes "$netctl"
          cosign attest --yes --type cyclonedx --predicate "$out/alixai-image.cdx.json" "$alixai"
          cosign attest --yes --type cyclonedx --predicate "$out/alixai-netctl-image.cdx.json" "$netctl"

      - name: Upload the image SBOMs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-sboms
          path: ${{ runner.temp }}/image-sboms
          if-no-files-found: error

  manifest:
    name: unsigned release manifest
    needs: [prepare, binaries, image]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      COMMIT: ${{ needs.prepare.outputs.commit }}
      CREATED_AT: ${{ needs.prepare.outputs.created_at }}
      ALIXAI_REF: ${{ needs.image.outputs.alixai_ref }}
      ALIXAI_DIGEST: ${{ needs.image.outputs.alixai_digest }}
      NETCTL_REF: ${{ needs.image.outputs.netctl_ref }}
      NETCTL_DIGEST: ${{ needs.image.outputs.netctl_digest }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go (version from go.mod)
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # No restored module or build cache: the CI workflows run third-party tools that could write to a shared cache, and a
          # release is built only from what go.sum verifies.
          cache: false

      - name: Keep Go toolchain telemetry off
        run: go telemetry off

      - name: Download the release files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: ${{ runner.temp }}/release

      - name: Download the image SBOMs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image-sboms
          path: ${{ runner.temp }}/release

      - name: Write the manifest
        # Models, licences and backends come from the registry embedded in the tool and from the pinned compose and backend
        # catalogue files of this commit; any unpinned image or unpinned model fails the step.
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/release"
          shopt -s nullglob
          args=()
          for f in "$dir"/*.tar.gz "$dir"/*.zip; do args+=(-artifact "archive=$f"); done
          for f in "$dir"/*.cdx.json; do args+=(-artifact "sbom=$f"); done
          args+=(-artifact "checksums=$dir/SHA256SUMS")
          for f in alixai_linux_amd64 alixai_linux_arm64 alixai_darwin_arm64 alixai_windows_amd64.exe \
            alixai-parser_linux_amd64 alixai-parser_linux_arm64 alixai-parser_darwin_arm64 alixai-parser_windows_amd64.exe; do
            args+=(-artifact "binary=$dir/$f")
          done
          go run ./tools/release manifest \
            -version "$VERSION" -commit "$COMMIT" -created-at "$CREATED_AT" \
            -image "alixai=$ALIXAI_REF@$ALIXAI_DIGEST" \
            -image "alixai-netctl=$NETCTL_REF@$NETCTL_DIGEST" \
            "${args[@]}" \
            -out "$dir/release-manifest.json"
          sha256sum "$dir/release-manifest.json"

      - name: Say what is left to do
        run: |
          {
            echo "### Release $VERSION is built, but not signed"
            echo
            echo "The release manifest is unsigned on purpose: its Ed25519 signature is made offline with the release key."
            echo
            echo '```'
            echo "go run ./tools/release sign -manifest release-manifest.json -key <release key file> -key-id <key id>"
            echo "go run ./tools/release verify -manifest release-manifest.json -pubkey <key id>=<public key file> -dir ."
            echo '```'
            echo
            echo "Then upload the signed file to the draft release and publish it. See docs/operations/release.md."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the release set
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-set
          path: ${{ runner.temp }}/release
          if-no-files-found: error

  draft:
    name: draft GitHub release
    needs: [prepare, manifest]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The `release` environment is configured with required reviewers: a human approves before anything is attached to a release.
    environment: release
    permissions:
      contents: write # create the draft release and attach the files
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Download the release set
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-set
          path: ${{ runner.temp }}/release

      - name: Create the draft release
        run: |
          set -euo pipefail
          gh release create "$TAG" "$RUNNER_TEMP"/release/* \
            --draft --verify-tag \
            --title "AlixAI $VERSION" \
            --notes "Draft. release-manifest.json is not signed yet: sign it offline, upload it over this one, then publish. See docs/operations/release.md."
