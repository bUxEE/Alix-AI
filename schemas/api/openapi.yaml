components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: alixai-context+jwt
      description: |
        A single-use application context token (ADR 0013): a JWS signed with the host application's Ed25519
        key (`alg` EdDSA, `typ` alixai-context+jwt) carrying application_id, tenant_id, workspace_id, `sub`
        (the principal), roles, capability_scopes and session_id. Sent only in the Authorization header,
        never in a query string, a cookie or a body.

  schemas:
    Error:
      $ref: ../common/error.schema.json
    TurnEvent:
      $ref: ../conversation/turn-event.schema.json
    PreparedAction:
      $ref: ../actions/prepared-action.schema.json
    ActionReceipt:
      $ref: ../actions/action-receipt.schema.json
    ReadyReport:
      type: object
      additionalProperties: false
      required: [status, ready, roles, checks]
      properties:
        status:
          type: string
          enum: [ok, degraded, unavailable]
        ready:
          type: boolean
        roles:
          type: array
          items:
            $ref: '#/components/schemas/ReadyRole'
        checks:
          type: array
          items:
            $ref: '#/components/schemas/ReadyCheck'
    ReadyRole:
      type: object
      additionalProperties: false
      required: [role, configured, status]
      properties:
        role:
          type: string
        configured:
          type: boolean
        status:
          type: string
          enum: [ok, degraded, unavailable]
        reason:
          type: string
        effect:
          type: string
    ReadyCheck:
      type: object
      additionalProperties: false
      required: [name, ok]
      properties:
        name:
          type: string
        ok:
          type: boolean
        reason:
          type: string

  responses:
    BadRequest:
      description: The request is malformed or fails validation (`validation_failed`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: |
        The context token is missing, malformed, expired, replayed or unverifiable (`unauthenticated`,
        `expired`, `replayed`, `scope_missing`). Mint a fresh token and retry.
      headers:
        WWW-Authenticate:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: |
        The caller may not do this: `scope_violation` (the path names another session, application or
        preparation than the token is bound to), `permission_denied`, `step_up_required` or `quarantined`
        (the application's package is not active).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: The thing is not in a state that allows this (`conflict`, `stale`, `replayed`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Gone:
      description: The session has ended; a new session needs a new authenticated context (`expired`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    PayloadTooLarge:
      description: The body exceeds gateway.max_body_bytes.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UnsupportedMediaType:
      description: The Content-Type is not the one this operation accepts.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unprocessable:
      description: The request is well-formed but its content is refused (for example a package with critical findings).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooManyRequests:
      description: Rate limited (`rate_limited`, retryable).
      headers:
        Retry-After:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unavailable:
      description: A dependency the request needs cannot answer (`unavailable`, `timeout`); nothing was done.
      headers:
        Retry-After:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
