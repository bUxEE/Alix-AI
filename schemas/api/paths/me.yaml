# Per-principal LLM account and catalog (ADR 0041, release 1.2.0; TTS role and voice/language in
# 1.3.0 / ADR 0043). Self-service usage and budget (1.3.0). Self-service only: the verified token's
# principal. Implemented by internal/gateway/routes_v1_me.go and routes_v1_me_usage.go (Wanted;
# unwired → unavailable). Never returns a secret. Keys arrive through the host server only.
paths:
  /v1/providers/catalog:
    get:
      operationId: getProviderCatalog
      tags: [providers]
      summary: Operator-approved provider catalog a principal may pick
      description: |
        Catalog entries for per-principal LLM bindings. No secrets. Any authenticated principal of an
        active application may read it. A profile not in this catalog is `provider_not_in_catalog` when
        chosen. Answers `unavailable` until the principal-LLM service is wired.
      responses:
        '200':
          description: The catalog.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderCatalog'
        '401':
          $ref: ../openapi.yaml#/components/responses/Unauthorized
        '403':
          $ref: ../openapi.yaml#/components/responses/Forbidden
        '503':
          $ref: ../openapi.yaml#/components/responses/Unavailable

  /v1/me/llm:
    get:
      operationId: getPrincipalLlm
      tags: [me]
      summary: The caller's LLM bindings and status
      description: |
        Bindings of the token's principal for the token's application. Never another principal. No secrets.
      responses:
        '200':
          description: The account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrincipalLlm'
        '401':
          $ref: ../openapi.yaml#/components/responses/Unauthorized
        '403':
          $ref: ../openapi.yaml#/components/responses/Forbidden
        '503':
          $ref: ../openapi.yaml#/components/responses/Unavailable

  /v1/me/llm/{role}:
    put:
      operationId: putPrincipalLlmRole
      tags: [me]
      summary: Bind a catalog profile to one LLM role
      description: |
        Chooses a catalog profile (and optional model) for the role. A profile not in the catalog is
        `validation_failed` with `details.reason` `provider_not_in_catalog`. Self only.
      parameters:
        - $ref: '#/components/parameters/PrincipalLlmRole'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PrincipalLlmBindingUpdate'
      responses:
        '200':
          description: The updated account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrincipalLlm'
        '400':
          $ref: ../openapi.yaml#/components/responses/BadRequest
        '401':
          $ref: ../openapi.yaml#/components/responses/Unauthorized
        '403':
          $ref: ../openapi.yaml#/components/responses/Forbidden
        '413':
          $ref: ../openapi.yaml#/components/responses/PayloadTooLarge
        '415':
          $ref: ../openapi.yaml#/components/responses/UnsupportedMediaType
        '503':
          $ref: ../openapi.yaml#/components/responses/Unavailable
    delete:
      operationId: deletePrincipalLlmRole
      tags: [me]
      summary: Clear the binding for one LLM role
      parameters:
        - $ref: '#/components/parameters/PrincipalLlmRole'
      responses:
        '200':
          description: The updated account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrincipalLlm'
        '400':
          $ref: ../openapi.yaml#/components/responses/BadRequest
        '401':
          $ref: ../openapi.yaml#/components/responses/Unauthorized
        '403':
          $ref: ../openapi.yaml#/components/responses/Forbidden
        '503':
          $ref: ../openapi.yaml#/components/responses/Unavailable

  /v1/me/providers/{provider}/credential:
    put:
      operationId: putPrincipalProviderCredential
      tags: [me]
      summary: Submit the caller's own provider credential (write-only)
      description: |
        Host-relayed manual key for the token's principal. Write-only: never returned, logged or put in
        an error. Stored with reserved tenant_id `alixai-principal-credential` and owner_principal_id
        set (ADR 0041). Self only.
      parameters:
        - $ref: '#/components/parameters/ProviderId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PrincipalCredentialSubmit'
      responses:
        '200':
          description: Safe connection status for this principal.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrincipalCredentialStatus'
        '400':
          $ref: ../openapi.yaml#/components/responses/BadRequest
        '401':
          $ref: ../openapi.yaml#/components/responses/Unauthorized
        '403':
          $ref: ../openapi.yaml#/components/responses/Forbidden
        '413':
          $ref: ../openapi.yaml#/components/responses/PayloadTooLarge
        '415':
          $ref: ../openapi.yaml#/components/responses/UnsupportedMediaType
        '503':
          $ref: ../openapi.yaml#/components/responses/Unavailable
    delete:
      operationId: deletePrincipalProviderCredential
      tags: [me]
      summary: Revoke the caller's own provider credential
      parameters:
        - $ref: '#/components/parameters/ProviderId'
      responses:
        '200':
          description: Safe connection status after revoke.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrincipalCredentialStatus'
        '400':
          $ref: ../openapi.yaml#/components/responses/BadRequest
        '401':
          $ref: ../openapi.yaml#/components/responses/Unauthorized
        '403':
          $ref: ../openapi.yaml#/components/responses/Forbidden
        '503':
          $ref: ../openapi.yaml#/components/responses/Unavailable

  /v1/me/providers/{provider}/billing-notice/ack:
    post:
      operationId: ackPrincipalProviderBillingNotice
      tags: [me]
      summary: Acknowledge the billing notice for the caller's provider
      parameters:
        - $ref: '#/components/parameters/ProviderId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PrincipalBillingAck'
      responses:
        '200':
          description: The acknowledgement.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrincipalBillingAckResult'
        '400':
          $ref: ../openapi.yaml#/components/responses/BadRequest
        '401':
          $ref: ../openapi.yaml#/components/responses/Unauthorized
        '403':
          $ref: ../openapi.yaml#/components/responses/Forbidden
        '409':
          $ref: ../openapi.yaml#/components/responses/Conflict
        '503':
          $ref: ../openapi.yaml#/components/responses/Unavailable

  /v1/me/oauth/{provider}/start:
    post:
      operationId: startPrincipalOAuth
      tags: [me]
      summary: Start popup/redirect OAuth bound to the caller
      description: |
        Reuses the 1.1 OAuth engine; the resulting credential is owner-bound to the token's principal
        (ADR 0041). Self only. Providers without official third-party OAuth answer `validation_failed`
        with `details.reason` `manual_fallback`. OpenAI Sign in with ChatGPT is loopback-only: a remote
        host callback (`callback: host`) also answers `manual_fallback` (use a manual API key). Google
        (`gemini`, `google-stt`, `google-tts`) and OpenRouter work with a registered https host callback
        and `external_providers.oauth.popup_origins`. Complete the host-callback path with
        `POST /v1/me/oauth/callback` (not the operator `/v1/oauth/callback`).
      parameters:
        - $ref: '#/components/parameters/ProviderId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PrincipalOAuthStart'
      responses:
        '200':
          description: Authorization URL and consent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrincipalOAuthStarted'
        '400':
          $ref: ../openapi.yaml#/components/responses/BadRequest
        '401':
          $ref: ../openapi.yaml#/components/responses/Unauthorized
        '403':
          $ref: ../openapi.yaml#/components/responses/Forbidden
        '503':
          $ref: ../openapi.yaml#/components/responses/Unavailable

  /v1/me/oauth/callback:
    post:
      operationId: completePrincipalOAuth
      tags: [me]
      summary: Complete the caller's own OAuth authorization (host callback)
      description: |
        The host relays the provider redirect for a flow the token's principal started
        (`POST /v1/me/oauth/{provider}/start`). Same application, reserved principal-credential
        tenant, workspace and principal; any other caller, and an unknown or spent state, is refused.
        Binds the resulting credential to the principal (ADR 0041). Self only — not the operator
        `/v1/oauth/callback`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PrincipalOAuthCallback'
      responses:
        '200':
          description: Safe credential status after completion.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrincipalCredentialStatus'
        '400':
          $ref: ../openapi.yaml#/components/responses/BadRequest
        '401':
          $ref: ../openapi.yaml#/components/responses/Unauthorized
        '403':
          $ref: ../openapi.yaml#/components/responses/Forbidden
        '409':
          $ref: ../openapi.yaml#/components/responses/Conflict
        '413':
          $ref: ../openapi.yaml#/components/responses/PayloadTooLarge
        '415':
          $ref: ../openapi.yaml#/components/responses/UnsupportedMediaType
        '503':
          $ref: ../openapi.yaml#/components/responses/Unavailable

  /v1/me/oauth/flows/{flow_id}:
    parameters:
      - name: flow_id
        in: path
        required: true
        description: The opaque flow id returned by start when presentation is popup.
        schema:
          type: string
          pattern: '^oaf_[0-9A-HJKMNP-TV-Z]{26}$'
    get:
      operationId: getPrincipalOAuthFlow
      tags: [me]
      summary: Read the status of the caller's own popup OAuth flow
      description: |
        Only the principal that started the flow may read it; any other caller, and an unknown id,
        answers `not_found`. Self only.
      responses:
        '200':
          description: The current flow status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrincipalOAuthFlowStatus'
        '401':
          $ref: ../openapi.yaml#/components/responses/Unauthorized
        '403':
          $ref: ../openapi.yaml#/components/responses/Forbidden
        '404':
          $ref: '#/components/responses/PrincipalOAuthFlowNotFound'
        '503':
          $ref: ../openapi.yaml#/components/responses/Unavailable
    delete:
      operationId: cancelPrincipalOAuthFlow
      tags: [me]
      summary: Cancel the caller's own pending popup OAuth flow
      description: |
        Idempotent. Only the principal that started the flow may cancel it; any other caller answers
        `not_found`. Self only.
      responses:
        '204':
          description: The flow is cancelled, or was already terminal.
        '401':
          $ref: ../openapi.yaml#/components/responses/Unauthorized
        '403':
          $ref: ../openapi.yaml#/components/responses/Forbidden
        '404':
          $ref: '#/components/responses/PrincipalOAuthFlowNotFound'
        '503':
          $ref: ../openapi.yaml#/components/responses/Unavailable

  /v1/me/usage:
    get:
      operationId: getMeUsage
      tags: [me]
      summary: The caller's own usage across tenants
      description: |
        Usage of the token's principal across every tenant of the application (or one tenant when
        `tenant_id` is set), grouped by provider, role and UTC day with meter units and charged cost
        estimates. Never another principal's rows. Paginated. Answers `unavailable` until the
        principal usage service is wired.
      parameters:
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: tenant_id
          in: query
          required: false
          description: Narrow to one tenant of the application; omit for every tenant.
          schema:
            type: string
            minLength: 1
            maxLength: 128
        - name: cursor
          in: query
          required: false
          description: The `next_cursor` of the previous page.
          schema:
            type: string
            pattern: '^[0-9]{1,18}$'
        - name: limit
          in: query
          required: false
          description: Groups per page (25 when not given, at most 100).
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: A page of the caller's usage groups.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeUsage'
        '400':
          $ref: ../openapi.yaml#/components/responses/BadRequest
        '401':
          $ref: ../openapi.yaml#/components/responses/Unauthorized
        '403':
          $ref: ../openapi.yaml#/components/responses/Forbidden
        '503':
          $ref: ../openapi.yaml#/components/responses/Unavailable

  /v1/me/budget:
    get:
      operationId: getMeBudget
      tags: [me]
      summary: The caller's own principal budgets and states
      description: |
        Workspace-bound and application-wide principal budgets of the token's principal, with their
        states. Never another principal's. Operators set budgets with `PUT /v1/providers/budgets`.
        Answers `unavailable` until the principal usage service is wired.
      responses:
        '200':
          description: The caller's budgets and states.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeBudget'
        '401':
          $ref: ../openapi.yaml#/components/responses/Unauthorized
        '403':
          $ref: ../openapi.yaml#/components/responses/Forbidden
        '503':
          $ref: ../openapi.yaml#/components/responses/Unavailable

components:
  responses:
    PrincipalOAuthFlowNotFound:
      description: The flow id is unknown or belongs to another principal (`not_found`).
      content:
        application/json:
          schema:
            $ref: ../openapi.yaml#/components/schemas/Error
  parameters:
    PrincipalLlmRole:
      name: role
      in: path
      required: true
      description: conversational_controller, language_realization, stt or tts.
      schema:
        type: string
        enum: [conversational_controller, language_realization, stt, tts]
    ProviderId:
      name: provider
      in: path
      required: true
      schema:
        type: string
        pattern: '^[a-z][a-z0-9_-]{0,31}$'
  schemas:
    ProviderCatalog:
      $ref: ../../providers/provider-catalog.schema.json
    PrincipalLlm:
      $ref: ../../providers/principal-llm.schema.json
    PrincipalLlmBindingUpdate:
      $ref: ../../providers/principal-llm-binding-update.schema.json
    PrincipalCredentialSubmit:
      type: object
      additionalProperties: false
      required: [key]
      properties:
        key:
          type: string
          minLength: 1
          maxLength: 8192
          description: Write-only. Never echoed.
        label:
          type: string
          minLength: 1
          maxLength: 80
    PrincipalCredentialStatus:
      type: object
      additionalProperties: false
      required: [provider_id, status]
      properties:
        provider_id:
          type: string
          pattern: '^[a-z][a-z0-9_-]{0,31}$'
        status:
          type: string
          enum: [missing, pending, active, expired, revoked, invalid, quarantined, reauthorization_required]
        account:
          type: object
          additionalProperties: true
          description: Safe account identifiers only; may be empty.
    PrincipalBillingAck:
      type: object
      additionalProperties: false
      required: [notice_version, consumer_subscription_is_not_api_access, separate_api_billing_understood]
      properties:
        notice_version:
          type: string
          minLength: 1
          maxLength: 64
        consumer_subscription_is_not_api_access:
          type: boolean
          const: true
        separate_api_billing_understood:
          type: boolean
          const: true
    PrincipalBillingAckResult:
      type: object
      additionalProperties: false
      required: [provider_id, notice_version, acknowledged_at]
      properties:
        provider_id:
          type: string
          pattern: '^[a-z][a-z0-9_-]{0,31}$'
        notice_version:
          type: string
        acknowledged_at:
          type: string
          format: date-time
    PrincipalOAuthStart:
      type: object
      additionalProperties: false
      required: [capabilities, redirect_uri]
      properties:
        capabilities:
          type: array
          minItems: 1
          maxItems: 16
          items:
            type: string
            minLength: 1
            maxLength: 64
        redirect_uri:
          type: string
          minLength: 1
          maxLength: 2048
        presentation:
          type: string
          enum: [redirect, popup]
        callback:
          type: string
          enum: [host, loopback]
        opener_origin:
          type: string
          minLength: 1
          maxLength: 256
        label:
          type: string
          minLength: 1
          maxLength: 80
    PrincipalOAuthStarted:
      type: object
      additionalProperties: false
      required: [authorization_url, redirect_uri, expires_at]
      properties:
        authorization_url:
          type: string
        redirect_uri:
          type: string
        expires_at:
          type: string
          format: date-time
        flow_id:
          type: string
        poll_interval_ms:
          type: integer
          minimum: 0
        consent:
          type: object
          additionalProperties: true
    PrincipalOAuthCallback:
      type: object
      additionalProperties: false
      required: [redirect_uri, query]
      properties:
        redirect_uri:
          type: string
          maxLength: 512
          description: The redirect URI the browser arrived on, without the query.
        query:
          type: string
          maxLength: 4096
          description: The query string of the redirect (`code`, `state`, `error`, `iss`).
    PrincipalOAuthFlowStatus:
      type: object
      additionalProperties: false
      required: [flow_id, provider, status, updated_at]
      properties:
        flow_id:
          type: string
          pattern: '^oaf_[0-9A-HJKMNP-TV-Z]{26}$'
        provider:
          type: string
          pattern: '^[a-z][a-z0-9_-]{0,31}$'
        status:
          type: string
          enum: [pending, completed, failed, expired, cancelled]
        reason:
          type: string
        updated_at:
          type: string
          format: date-time
    MeUsage:
      $ref: ../../providers/me-usage.schema.json
    MeBudget:
      $ref: ../../providers/me-budget.schema.json
