# Operations (master plan 14.2 "Operations"): queue status, provider/model status and the audit export under
# authorization. Implemented by internal/gateway/routes_ops.go over internal/diag and internal/audit.
#
# The host authorises each operation by putting its capability in the context token (`capability_scopes`):
#
#   ops.queue.read      read the queue counts of the caller's own application, tenant and workspace
#   ops.providers.read  read the status of the model roles
#   ops.analyst.read    read a tenant's analyst ability ceilings (ADR 0047)
#   ops.analyst.write   write a tenant's analyst ability ceilings (narrow only)
#   audit.export        export the audit events of the caller's own application, tenant and workspace
#
# The match is exact (no wildcard, no role stands in), and a token that lacks the capability is
# `permission_denied` before anything is read. A deployment may add a rule of its own on top; it can only refuse.
# An application whose package is not active serves no operations (`quarantined`). While the server has no
# operations service wired, every route here answers `unavailable`: never an empty success.
#
# What this API does not carry: the deployment-wide queue, resource usage, the Prometheus text and the diagnostics
# bundle (configuration, versions, health, recent errors). A token minted by a host application must not read the
# counts of other applications or the deployment's configuration, so that view is the operator's: it is served on a
# loopback-only listener and the diagnostics bundle also needs the operator credential. Nothing here, and nothing
# behind it, ever sends a metric, a bundle or a usage report anywhere (master plan 3, rule 3).
paths:
  /v1/ops/queue:
    get:
      operationId: getQueueStatus
      tags: [operations]
      summary: Queue status of the caller's own scope
      description: |
        The job queue as the caller's own application, tenant and workspace see it: for each of the six priority
        classes (master plan 17.1, most urgent first) the configured workers and depth limit and the number of jobs
        pending, running, succeeded, failed and cancelled. Succeeded, failed and cancelled count the finished jobs
        still retained. Other applications, tenants and workspaces are never counted. Needs `ops.queue.read`.
      responses:
        '200':
          description: The queue status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueueReport'
        '401':
          $ref: ../openapi.yaml#/components/responses/Unauthorized
        '403':
          $ref: ../openapi.yaml#/components/responses/Forbidden
        '503':
          $ref: ../openapi.yaml#/components/responses/Unavailable

  /v1/ops/providers:
    get:
      operationId: getProviderStatus
      tags: [operations]
      summary: Provider and model status
      description: |
        The model roles (controller, router, embedder, reranker and the voice roles): whether a provider is
        configured for each, which runtime and version serve it, its health and, when it is not `ok`, the stable
        degradation code and what the service does instead (master plan 18). `status` is the summary: `unavailable`
        when the controller cannot answer, `degraded` when any other configured role is not `ok`. Reasons are
        redacted. Needs `ops.providers.read`.
      responses:
        '200':
          description: The provider and model status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderReport'
        '401':
          $ref: ../openapi.yaml#/components/responses/Unauthorized
        '403':
          $ref: ../openapi.yaml#/components/responses/Forbidden
        '503':
          $ref: ../openapi.yaml#/components/responses/Unavailable

  /v1/ops/audit/export:
    post:
      operationId: exportAuditEvents
      tags: [operations]
      summary: Export the caller's own audit events
      description: |
        Streams the audit events of the caller's own application, tenant and workspace as JSON lines
        (`application/x-ndjson`), oldest first: one audit event per line exactly as stored (already redacted, and
        verifiable against its hash), then a last line, an `AuditExportTrailer` `{"complete": true, "events": N}`.
        The status is sent with the first byte, so a refusal is an ordinary error response and nothing is sent; a
        failure half way is told by the missing trailer. The export is itself recorded in the audit log before the
        first event is read, and refused if it cannot be recorded. The body is optional; `types` keeps only those
        event types, `since` (inclusive) and `until` (exclusive) bound the time of the event. Needs `audit.export`.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuditExportRequest'
      responses:
        '200':
          description: The export.
          content:
            application/x-ndjson:
              schema:
                type: string
                description: |
                  Lines of JSON, each an audit event except the last, which is an `AuditExportTrailer`.
        '400':
          $ref: ../openapi.yaml#/components/responses/BadRequest
        '401':
          $ref: ../openapi.yaml#/components/responses/Unauthorized
        '403':
          $ref: ../openapi.yaml#/components/responses/Forbidden
        '413':
          $ref: ../openapi.yaml#/components/responses/PayloadTooLarge
        '415':
          $ref: ../openapi.yaml#/components/responses/UnsupportedMediaType
        '503':
          $ref: ../openapi.yaml#/components/responses/Unavailable

  /v1/ops/erasure:
    post:
      operationId: startErasure
      tags: [operations]
      summary: Start a GDPR erasure job (ADR 0036)
      description: |
        Starts the same erasure as `alixai retention erase` (sessions, history, durable turn
        blocks, memory, files including generated exports; audit payloads become signed tombstones —
        the chain survives). For `level: principal`, `scope` chooses the breadth:

        - omitted or `tenant` (default): erase the principal **inside that tenant only**. A tenant
          administrator of that tenant may start it. Never revokes principal-owned LLM credentials
          or bindings (ADR 0041: those belong to the person across every tenant).
        - `application`: erase the principal in **every tenant** of the application and revoke their
          principal-owned credentials/bindings. **Deployment operator only** — the GDPR "erase this
          person" path (`alixai retention erase -principal` without `-tenant-scoped`).

        Answers `202` with a job. Idempotent: a second request for the same target while one runs
        returns the running job. RAG source registrations use their own deletion path and are not
        removed here.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErasureRequest'
      responses:
        '202':
          description: The erasure job was accepted (or the running job for the same target).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErasureJobAccepted'
        '400':
          $ref: ../openapi.yaml#/components/responses/BadRequest
        '401':
          $ref: ../openapi.yaml#/components/responses/Unauthorized
        '403':
          $ref: ../openapi.yaml#/components/responses/Forbidden
        '503':
          $ref: ../openapi.yaml#/components/responses/Unavailable

  /v1/ops/erasure/{job_id}:
    get:
      operationId: getErasureJob
      tags: [operations]
      summary: Read the status of an erasure job
      parameters:
        - name: job_id
          in: path
          required: true
          schema:
            type: string
            pattern: '^erj_[0-9A-HJKMNP-TV-Z]{26}$'
      responses:
        '200':
          description: The job status and counts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErasureJobStatus'
        '401':
          $ref: ../openapi.yaml#/components/responses/Unauthorized
        '403':
          $ref: ../openapi.yaml#/components/responses/Forbidden
        '404':
          $ref: '#/components/responses/ErasureJobNotFound'
        '503':
          $ref: ../openapi.yaml#/components/responses/Unavailable

  /v1/ops/private-llm/endpoints/{endpoint_id}:
    parameters:
      - name: endpoint_id
        in: path
        required: true
        schema:
          type: string
          pattern: '^ple_[0-9A-HJKMNP-TV-Z]{26}$'
    put:
      operationId: putPrivateLlmEndpoint
      tags: [operations]
      summary: Register or update a private self-hosted LLM endpoint
      description: |
        Upserts one OpenAI-compatible private endpoint (ADR 0045). Deployment operator.
        Needs `ops.private_llm.write`. No secret in the body beyond an opaque credential_ref.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PrivateLlmEndpointUpdate'
      responses:
        '200':
          description: The endpoint.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrivateLlmEndpoint'
        '400':
          $ref: ../openapi.yaml#/components/responses/BadRequest
        '401':
          $ref: ../openapi.yaml#/components/responses/Unauthorized
        '403':
          $ref: ../openapi.yaml#/components/responses/Forbidden
        '503':
          $ref: ../openapi.yaml#/components/responses/Unavailable
    get:
      operationId: getPrivateLlmEndpoint
      tags: [operations]
      summary: Read a private LLM endpoint
      description: Needs `ops.private_llm.read` (or write).
      responses:
        '200':
          description: The endpoint.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrivateLlmEndpoint'
        '401':
          $ref: ../openapi.yaml#/components/responses/Unauthorized
        '403':
          $ref: ../openapi.yaml#/components/responses/Forbidden
        '404':
          $ref: '#/components/responses/PrivateLlmEndpointNotFound'
        '503':
          $ref: ../openapi.yaml#/components/responses/Unavailable
    delete:
      operationId: deletePrivateLlmEndpoint
      tags: [operations]
      summary: Remove a private LLM endpoint
      description: |
        Removes the endpoint and clears pins/bindings that named it. Needs `ops.private_llm.write`.
      responses:
        '204':
          description: Removed (or already absent).
        '401':
          $ref: ../openapi.yaml#/components/responses/Unauthorized
        '403':
          $ref: ../openapi.yaml#/components/responses/Forbidden
        '503':
          $ref: ../openapi.yaml#/components/responses/Unavailable

  /v1/ops/tenants/{tenant_id}/private-llm:
    parameters:
      - name: tenant_id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 128
    put:
      operationId: putTenantPrivateLlm
      tags: [operations]
      summary: Pin a tenant to a private LLM endpoint
      description: |
        Inside this tenant every bindable role the endpoint serves uses it, overriding personal
        external bindings (ADR 0045). Deployment operator, or tenant admin of this tenant with
        `ops.private_llm.write`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PrivateLlmTenantPinUpdate'
      responses:
        '200':
          description: The pin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrivateLlmTenantPin'
        '400':
          $ref: ../openapi.yaml#/components/responses/BadRequest
        '401':
          $ref: ../openapi.yaml#/components/responses/Unauthorized
        '403':
          $ref: ../openapi.yaml#/components/responses/Forbidden
        '503':
          $ref: ../openapi.yaml#/components/responses/Unavailable
    get:
      operationId: getTenantPrivateLlm
      tags: [operations]
      summary: Read a tenant's private LLM pin
      responses:
        '200':
          description: The pin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrivateLlmTenantPin'
        '401':
          $ref: ../openapi.yaml#/components/responses/Unauthorized
        '403':
          $ref: ../openapi.yaml#/components/responses/Forbidden
        '404':
          $ref: '#/components/responses/PrivateLlmTenantPinNotFound'
        '503':
          $ref: ../openapi.yaml#/components/responses/Unavailable
    delete:
      operationId: deleteTenantPrivateLlm
      tags: [operations]
      summary: Clear a tenant's private LLM pin
      responses:
        '204':
          description: Cleared (or already absent).
        '401':
          $ref: ../openapi.yaml#/components/responses/Unauthorized
        '403':
          $ref: ../openapi.yaml#/components/responses/Forbidden
        '503':
          $ref: ../openapi.yaml#/components/responses/Unavailable

  /v1/ops/tenants/{tenant_id}/analyst:
    parameters:
      - name: tenant_id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 128
    get:
      operationId: getTenantAnalyst
      tags: [operations]
      summary: Read a tenant's analyst ability ceilings
      description: |
        Tenant-level analyst settings (ADR 0047). Deployment operator, or tenant admin of this
        tenant with `ops.analyst.read`. The effective abilities a turn sees also intersect
        deployment config and the application package (`GET /v1/me/analyst`).
      responses:
        '200':
          description: The tenant settings (empty object when never written).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantAnalystSettings'
        '401':
          $ref: ../openapi.yaml#/components/responses/Unauthorized
        '403':
          $ref: ../openapi.yaml#/components/responses/Forbidden
        '503':
          $ref: ../openapi.yaml#/components/responses/Unavailable
    put:
      operationId: putTenantAnalyst
      tags: [operations]
      summary: Set a tenant's analyst ability ceilings
      description: |
        Replaces the tenant document. A tenant may only narrow: enabling an ability the
        deployment or package has off is refused (`permission_denied`). Deployment operator,
        or tenant admin of this tenant with `ops.analyst.write`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantAnalystSettingsUpdate'
      responses:
        '200':
          description: The stored settings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantAnalystSettings'
        '400':
          $ref: ../openapi.yaml#/components/responses/BadRequest
        '401':
          $ref: ../openapi.yaml#/components/responses/Unauthorized
        '403':
          $ref: ../openapi.yaml#/components/responses/Forbidden
        '503':
          $ref: ../openapi.yaml#/components/responses/Unavailable

  /v1/ops/principals/{principal_id}/private-llm:
    parameters:
      - name: principal_id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 128
    put:
      operationId: putPrincipalPrivateLlm
      tags: [operations]
      summary: Activate a principal's private LLM binding
      description: |
        Host activates the paid private-LLM feature for a principal and binds roles to an endpoint
        (ADR 0045). Deployment operator. Needs `ops.private_llm.write`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PrivateLlmPrincipalBindingUpdate'
      responses:
        '200':
          description: The binding.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrivateLlmPrincipalBinding'
        '400':
          $ref: ../openapi.yaml#/components/responses/BadRequest
        '401':
          $ref: ../openapi.yaml#/components/responses/Unauthorized
        '403':
          $ref: ../openapi.yaml#/components/responses/Forbidden
        '503':
          $ref: ../openapi.yaml#/components/responses/Unavailable
    get:
      operationId: getPrincipalPrivateLlm
      tags: [operations]
      summary: Read a principal's operator private LLM binding
      responses:
        '200':
          description: The binding.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrivateLlmPrincipalBinding'
        '401':
          $ref: ../openapi.yaml#/components/responses/Unauthorized
        '403':
          $ref: ../openapi.yaml#/components/responses/Forbidden
        '404':
          $ref: '#/components/responses/PrivateLlmPrincipalBindingNotFound'
        '503':
          $ref: ../openapi.yaml#/components/responses/Unavailable
    delete:
      operationId: deletePrincipalPrivateLlm
      tags: [operations]
      summary: Clear a principal's operator private LLM binding
      responses:
        '204':
          description: Cleared (or already absent).
        '401':
          $ref: ../openapi.yaml#/components/responses/Unauthorized
        '403':
          $ref: ../openapi.yaml#/components/responses/Forbidden
        '503':
          $ref: ../openapi.yaml#/components/responses/Unavailable

components:
  responses:
    ErasureJobNotFound:
      description: The job id is unknown or out of the caller's tenant (`not_found`).
      content:
        application/json:
          schema:
            $ref: ../openapi.yaml#/components/schemas/Error
    PrivateLlmEndpointNotFound:
      description: The endpoint id is unknown (`not_found`).
      content:
        application/json:
          schema:
            $ref: ../openapi.yaml#/components/schemas/Error
    PrivateLlmTenantPinNotFound:
      description: The tenant has no private LLM pin (`not_found`).
      content:
        application/json:
          schema:
            $ref: ../openapi.yaml#/components/schemas/Error
    PrivateLlmPrincipalBindingNotFound:
      description: The principal has no operator private LLM binding (`not_found`).
      content:
        application/json:
          schema:
            $ref: ../openapi.yaml#/components/schemas/Error
  schemas:
    PrivateLlmEndpoint:
      $ref: ../../providers/private-llm-endpoint.schema.json
    PrivateLlmEndpointUpdate:
      $ref: ../../providers/private-llm-endpoint-update.schema.json
    PrivateLlmTenantPin:
      $ref: ../../providers/private-llm-tenant-pin.schema.json
    PrivateLlmTenantPinUpdate:
      $ref: ../../providers/private-llm-tenant-pin-update.schema.json
    PrivateLlmPrincipalBinding:
      $ref: ../../providers/private-llm-principal-binding.schema.json
    PrivateLlmPrincipalBindingUpdate:
      $ref: ../../providers/private-llm-principal-binding-update.schema.json

    TenantAnalystSettings:
      $ref: ../../analyst/tenant-settings.schema.json
    TenantAnalystSettingsUpdate:
      description: |
        Body of PUT /v1/ops/tenants/{tenant_id}/analyst. Same shape as TenantAnalystSettings
        without server-owned `updated_at` (the core sets it).
      type: object
      additionalProperties: false
      properties:
        enabled:
          type: boolean
        abilities:
          type: object
          additionalProperties: false
          properties:
            loop: { type: boolean }
            compute: { type: boolean }
            forecasts: { type: boolean }
            presentation: { type: boolean }
            drafts: { type: boolean }
            knowledge: { type: boolean }
            web_search: { type: boolean }
            web_fetch: { type: boolean }
        web:
          type: object
          additionalProperties: false
          properties:
            allow_hosts:
              type: array
              maxItems: 256
              items:
                type: string
                minLength: 1
                maxLength: 253
                pattern: '^[A-Za-z0-9.-]+$'
            deny_hosts:
              type: array
              maxItems: 256
              items:
                type: string
                minLength: 1
                maxLength: 253
                pattern: '^[A-Za-z0-9.-]+$'

    ErasureRequest:
      type: object
      additionalProperties: false
      required: [level]
      properties:
        level:
          type: string
          enum: [principal, tenant, workspace]
        scope:
          type: string
          enum: [tenant, application, workspace]
          description: |
            Only when level is principal. `tenant` (default when omitted) is tenant-local;
            `application` is GDPR application-wide (deployment operator only);
            `workspace` erases that principal inside one workspace only (requires workspace_id;
            never revokes credentials/bindings).
        tenant_id:
          type: string
          description: |
            Defaults to the token's tenant. A tenant admin may only name their own. Ignored when
            scope is application (every tenant of the application is erased).
        workspace_id:
          type: string
          description: |
            Required when level is workspace (defaults to the token's workspace), and when
            level is principal with scope workspace (defaults to the token's workspace).
        principal_id:
          type: string
          description: Required when level is principal.
        reason:
          type: string
          maxLength: 512
          description: Short reason signed into tombstones; no personal data.
    ErasureJobAccepted:
      type: object
      additionalProperties: false
      required: [job_id, status]
      properties:
        job_id:
          type: string
          pattern: '^erj_[0-9A-HJKMNP-TV-Z]{26}$'
        status:
          type: string
          enum: [queued, running, completed, failed]
    ErasureCounts:
      type: object
      additionalProperties: false
      properties:
        audit_events_erased:
          type: integer
          minimum: 0
        preparations_removed:
          type: integer
          minimum: 0
        receipts_removed:
          type: integer
          minimum: 0
        transcript_turns_removed:
          type: integer
          minimum: 0
        session_turns_removed:
          type: integer
          minimum: 0
        sessions_removed:
          type: integer
          minimum: 0
        sessions_ended:
          type: integer
          minimum: 0
        memory_items_removed:
          type: integer
          minimum: 0
        files_removed:
          type: integer
          minimum: 0
        principal_credentials_revoked:
          type: integer
          minimum: 0
        principal_bindings_removed:
          type: integer
          minimum: 0
        more:
          type: boolean
    ErasureJobStatus:
      type: object
      additionalProperties: false
      required: [job_id, status, level, tenant_id]
      properties:
        job_id:
          type: string
        status:
          type: string
          enum: [queued, running, completed, failed]
        level:
          type: string
          enum: [principal, tenant, workspace]
        scope:
          type: string
          enum: [tenant, application, workspace]
          description: Present when level is principal (`tenant`, `application` or `workspace`).
        tenant_id:
          type: string
          description: Empty when scope is application (every tenant of the application).
        workspace_id:
          type: string
        principal_id:
          type: string
        counts:
          $ref: '#/components/schemas/ErasureCounts'
        error:
          type: string
        finished_at:
          type: string
          format: date-time
    QueueClass:
      type: object
      additionalProperties: false
      required: [class, priority, workers, max_depth, pending, running, succeeded, failed, cancelled]
      properties:
        class:
          type: string
          enum: [auth_commit, turn, rag_query, app_read, ingest, maintenance]
          description: The priority class (master plan 17.1).
        priority:
          type: integer
          minimum: 1
          maximum: 6
          description: The rank of the class, 1 the most urgent.
        workers:
          type: integer
          minimum: 0
          description: The configured workers of the class.
        max_depth:
          type: integer
          minimum: 0
          description: The configured limit on pending jobs of the class.
        pending:
          type: integer
          minimum: 0
          description: Waiting jobs, including retries still in back-off.
        running:
          type: integer
          minimum: 0
        succeeded:
          type: integer
          minimum: 0
          description: Finished jobs still retained.
        failed:
          type: integer
          minimum: 0
          description: Failed jobs still retained.
        cancelled:
          type: integer
          minimum: 0
          description: Cancelled jobs still retained.
        oldest_ready_age_ms:
          type: integer
          minimum: 0
          description: |
            How long the longest-waiting ready job has been eligible to run. Only the deployment-wide view knows
            it, so it is absent here.
    QueueReport:
      type: object
      additionalProperties: false
      required: [at, classes]
      properties:
        at:
          type: string
          format: date-time
        classes:
          type: array
          description: All six classes, most urgent first.
          items:
            $ref: '#/components/schemas/QueueClass'
    ProviderRole:
      type: object
      additionalProperties: false
      required: [role, configured, status]
      properties:
        role:
          type: string
          enum: [controller, router, embedder, reranker, stt, tts, vad]
        configured:
          type: boolean
          description: Whether a provider is registered for the role.
        provider:
          type: string
          description: The runtime that serves the role ("localai", "fake"), when it names itself.
        status:
          type: string
          enum: [ok, degraded, unavailable]
          description: An unconfigured role is `unavailable`.
        reason:
          type: string
          description: A short explanation when the role is not `ok` (redacted).
        version:
          type: string
          description: The runtime version the adapter observed.
        since:
          type: string
          format: date-time
          description: When the status last changed.
        effect:
          type: string
          description: The stable degradation code, set when the role is not `ok`.
        behavior:
          type: string
          description: What the service does instead, set when the role is not `ok` (master plan 18).
    ProviderReport:
      type: object
      additionalProperties: false
      required: [status, roles]
      properties:
        status:
          type: string
          enum: [ok, degraded, unavailable]
        roles:
          type: array
          items:
            $ref: '#/components/schemas/ProviderRole'
    AuditExportRequest:
      type: object
      additionalProperties: false
      properties:
        types:
          type: array
          maxItems: 64
          description: Keep only these event types (dotted lower-case names such as `action.committed`).
          items:
            type: string
        since:
          type: string
          format: date-time
          description: Inclusive lower bound of the time of the event.
        until:
          type: string
          format: date-time
          description: Exclusive upper bound of the time of the event. Must be after `since`.
    AuditExportTrailer:
      type: object
      additionalProperties: false
      required: [complete, events]
      properties:
        complete:
          const: true
        events:
          type: integer
