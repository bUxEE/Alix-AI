id: appointments.cancel
version: 1.0.0
audience: user
title: Cancel an appointment
purpose: Cancel an upcoming appointment that the caller is allowed to see. The cancellation is prepared first, its exact effects are shown, and it is committed only after the user confirms. Committing releases the slot and queues a cancellation message to the patient's contact details.
scope_level: workspace
permissions:
  - appointments.cancel
fields:
  - name: appointment
    type: entity_ref
    entity_type: appointment
    required: true
    description: The upcoming appointment to cancel, named by its reference, its identifier, its local date or the patient's name.
  - name: reason
    type: enum
    required: false
    values:
      - patient_request
      - provider_unavailable
      - scheduling_error
      - other
    description: Why the appointment is cancelled.
entity_types:
  appointment:
    description: An upcoming appointment of the clinic site, as the caller is allowed to see it.
    resolve:
      endpoint: clinic-mcp
      mcp_tool: resolve_appointment
      result_schema: schemas/resolve.result.schema.json
ambiguity:
  - id: appointment_multiple
    field: appointment
    when: multiple_matches
    action: ask_user
    max_choices: 5
  - id: appointment_none
    field: appointment
    when: no_match
    action: reject
validation:
  - id: appointment_active
    fields:
      - appointment
    description: The appointment must not already be cancelled.
    error_code: conflict
  - id: appointment_not_started
    fields:
      - appointment
    description: An appointment that has started or passed cannot be cancelled.
    error_code: validation_failed
failure_states:
  - code: permission_denied
    description: The principal's role may not cancel appointments.
  - code: scope_violation
    description: The appointment is outside the principal's access (another site, another clinic group, another patient's or doctor's), or does not exist. The application does not say which.
  - code: validation_failed
    description: The appointment has started or passed, or a value is malformed. Nothing was cancelled.
  - code: conflict
    description: The appointment is already cancelled. Nothing was changed.
  - code: stale
    description: The appointment changed after the cancellation was prepared, so the preparation is no longer valid. Nothing was cancelled; it can be prepared again.
  - code: expired
    description: The prepared cancellation was not confirmed in time, or was withdrawn. Nothing was cancelled.
  - code: uncertain_outcome
    description: The commit response was lost. Whether the appointment was cancelled is established through the status operation before anything is retried.
  - code: missing_fields
    description: A required field (appointment) was not supplied. Nothing was cancelled.
  - code: unavailable
    description: The clinic database cannot be reached. Nothing was cancelled.
effect_class: external
risk_level: 2
operations:
  validate:
    endpoint: clinic-mcp
    mcp_tool: appointments_cancel_validate
    result_schema: schemas/appointments.cancel.validation.result.schema.json
    timeout_ms: 5000
  prepare:
    endpoint: clinic-mcp
    mcp_tool: appointments_cancel_prepare
    result_schema: schemas/appointments.cancel.prepared.result.schema.json
    timeout_ms: 8000
  commit:
    endpoint: clinic-mcp
    mcp_tool: appointments_cancel_commit
    result_schema: schemas/appointments.cancel.receipt.result.schema.json
    timeout_ms: 15000
  status:
    endpoint: clinic-mcp
    mcp_tool: appointments_cancel_status
    result_schema: schemas/appointments.cancel.receipt.result.schema.json
    timeout_ms: 5000
confirmation:
  mode: explicit
prepared_action:
  ttl_seconds: 600
  invalidated_by:
    - record_revision
    - permission_change
    - user_change
idempotency:
  key_source: prepared_action_id
  window_seconds: 86400
  on_replay: return_original_receipt
response_obligations:
  - fact: appointment_reference
    when: always
    description: The reference of the appointment.
  - fact: appointment_starts_at
    when: always
    description: The local date and time of the appointment.
  - fact: patient_name
    when: prepared
    description: The patient the appointment is for.
  - fact: doctor_name
    when: prepared
    description: The doctor the appointment is with.
next_actions:
  - id: book_new_appointment
    after: success
    capability_id: appointments.book
doc_refs:
  - ac-field-appointment
  - ac-field-reason
  - ac-rule-appointment_active
  - ac-rule-appointment_not_started
  - ac-perm-appointments.cancel
  - ac-failure-permission_denied
  - ac-failure-scope_violation
  - ac-failure-validation_failed
  - ac-failure-conflict
  - ac-failure-stale
  - ac-failure-expired
  - ac-failure-uncertain_outcome
  - ac-failure-missing_fields
  - ac-failure-unavailable
  - ac-risk
  - ac-confirmation
  - ac-outcome-cancelled
examples:
  - id: en-cancel-by-reference
    language: en
    test_only: true
    utterance: Cancel appointment APT-7K3Q9X
    expected_fields:
      appointment: APT-7K3Q9X
  - id: en-cancel-with-reason
    language: en
    test_only: true
    utterance: Cancel Maria Rossi's appointment on 2026-10-14, the doctor is unavailable
    expected_fields:
      appointment: Maria Rossi 2026-10-14
      reason: provider_unavailable
  - id: it-annulla-con-riferimento
    language: it
    test_only: true
    utterance: Annulla l'appuntamento APT-7K3Q9X
    expected_fields:
      appointment: APT-7K3Q9X
  - id: it-annulla-su-richiesta
    language: it
    test_only: true
    utterance: Annulla la visita di Maria Rossi del 2026-10-14, lo chiede la paziente
    expected_fields:
      appointment: Maria Rossi 2026-10-14
      reason: patient_request
