openapi: 3.0.3
info:
  title: Facility Maintenance API
  version: 1.0.0
  description: 'The approved operations of the synthetic facility-maintenance application, the second AlixAI reference application. Every reply is a DeterministicResult with the HTTP status a REST host would pick. The identity of the caller travels in X-AlixAI-Identity; the application reauthorises it on every call. A deployment may set FACILITY_API_TOKEN, and the application then also requires Authorization: Bearer on every operation; the package declares no credential reference, so the adapter sends none.'
servers:
- url: http://127.0.0.1:8788
tags:
- name: work orders
- name: resolution
- name: workorders.create
- name: workorders.assign
- name: workorders.close
- name: assets.decommission
- name: management
- name: test support
paths:
  /v1/work-orders:
    get:
      operationId: listWorkOrders
      summary: List work orders
      description: 'Read: the work orders the caller may see, most urgent first (level 0). A technician sees the work assigned to them and the work they raised; supervisors and auditors see the whole site.'
      tags:
      - work orders
      parameters:
      - $ref: '#/components/parameters/Identity'
      - name: status
        in: query
        required: false
        description: Only this status; any lists all.
        schema:
          type: string
          enum:
          - open
          - assigned
          - closed
          - any
      - name: priority
        in: query
        required: false
        description: Only this priority.
        schema:
          type: string
          enum:
          - low
          - normal
          - high
          - urgent
      - name: asset
        in: query
        required: false
        description: Only work orders of this asset.
        schema:
          type: string
          maxLength: 128
      - name: technician
        in: query
        required: false
        description: Only work orders assigned to this technician.
        schema:
          type: string
          maxLength: 128
      - name: max_results
        in: query
        required: false
        description: How many to list at most.
        schema:
          type: integer
          minimum: 1
          maximum: 10
      responses:
        '200':
          $ref: '#/components/responses/Result'
        '401':
          $ref: '#/components/responses/Result'
        '403':
          $ref: '#/components/responses/Result'
        '409':
          $ref: '#/components/responses/Result'
        '422':
          $ref: '#/components/responses/Result'
        '429':
          $ref: '#/components/responses/Result'
        '503':
          $ref: '#/components/responses/Result'
        default:
          $ref: '#/components/responses/Result'
  /v1/resolve/assets:
    post:
      operationId: resolveAsset
      summary: Resolve a asset
      description: 'Read: the asset candidates a mention resolves to, as the caller may see them. An empty mention matches nothing.'
      tags:
      - resolution
      parameters:
      - $ref: '#/components/parameters/Identity'
      requestBody:
        required: true
