id: workorders.assign
version: 1.0.0
audience: user
title: Assign a technician
purpose: Assign a technician of the caller's site to a work order that is not closed, optionally with a note. The assignment is prepared first, its exact effects are shown, and it is committed only after the user confirms. Committing sets the assignee and sends a notification to the technician.
scope_level: workspace
permissions:
- workorders.assign
fields:
- name: work_order
  type: entity_ref
  entity_type: work_order
  required: true
  description: The work order to assign.
- name: technician
  type: entity_ref
  entity_type: technician
  required: true
  description: The technician who takes the work.
- name: note
  type: string
  required: false
  description: A note for the technician, included in the notification. Optional free text.
  max_length: 200
entity_types:
  work_order:
    description: A work order of the site that is not closed.
    resolve:
      endpoint: facility-api
      openapi_operation_id: resolveWorkOrder
      result_schema: schemas/resolve.result.schema.json
  technician:
    description: A technician of the site.
    resolve:
      endpoint: facility-api
      openapi_operation_id: resolveTechnician
      result_schema: schemas/resolve.result.schema.json
ambiguity:
- id: work_order_multiple
  field: work_order
  when: multiple_matches
  action: ask_user
  max_choices: 5
- id: work_order_none
  field: work_order
  when: no_match
  action: reject
- id: technician_multiple
  field: technician
  when: multiple_matches
  action: ask_user
  max_choices: 5
- id: technician_none
  field: technician
  when: no_match
  action: reject
validation:
- id: work_order_open
  fields:
  - work_order
  description: The work order must not be closed.
  error_code: conflict
- id: technician_assignable
  fields:
  - technician
  description: The technician must be active and have fewer than 5 open work orders.
  error_code: conflict
- id: already_assigned
  fields:
  - work_order
  - technician
  description: The work order must not already be assigned to this technician.
  error_code: conflict
- id: note_length
  fields:
  - note
  description: The note must be at most 200 characters of plain text.
  error_code: validation_failed
failure_states:
- code: permission_denied
  description: The principal's role may not use this capability.
- code: scope_violation
  description: A record named is outside the principal's access (another site, another tenant, or work the role may not see), or does not exist. The application does not say which.
- code: validation_failed
  description: A value is missing, malformed or out of bounds. Nothing was changed.
- code: conflict
  description: A business rule is violated by the current state of the records. Nothing was changed.
- code: stale
  description: A record changed after the action was prepared, so the preparation is no longer valid. Nothing was changed; it can be prepared again.
- code: expired
  description: The prepared action was not confirmed in time, or was withdrawn. Nothing was changed.
- code: uncertain_outcome
  description: The commit response was lost. Whether the change was applied is established through the status operation before anything is retried.
- code: missing_fields
  description: A required field was not supplied. Nothing was changed.
- code: unavailable
  description: The application's data store cannot be reached. Nothing was changed.
effect_class: external
risk_level: 2
operations:
  validate:
    endpoint: facility-api
    openapi_operation_id: validateAssignTechnician
    result_schema: schemas/workorders.assign.validation.result.schema.json
    timeout_ms: 5000
  prepare:
    endpoint: facility-api
    openapi_operation_id: prepareAssignTechnician
    result_schema: schemas/workorders.assign.prepared.result.schema.json
    timeout_ms: 8000
  commit:
    endpoint: facility-api
    openapi_operation_id: commitAssignTechnician
    result_schema: schemas/workorders.assign.receipt.result.schema.json
    timeout_ms: 15000
  status:
    endpoint: facility-api
    openapi_operation_id: statusAssignTechnician
    result_schema: schemas/workorders.assign.receipt.result.schema.json
    timeout_ms: 5000
confirmation:
  mode: explicit
prepared_action:
  ttl_seconds: 600
  invalidated_by:
  - record_revision
  - permission_change
  - user_change
idempotency:
  key_source: prepared_action_id
  window_seconds: 86400
  on_replay: return_original_receipt
response_obligations:
- fact: work_order_id
  when: always
  description: The reference of the work order.
- fact: technician_name
  when: always
  description: The technician the work order is assigned to.
- fact: work_order_title
  when: prepared
  description: The title of the work order.
- fact: notification_reference
  when: success
  description: The reference of the notification sent to the technician.
next_actions:
- id: show_open_orders
  after: success
  capability_id: workorders.list
- id: show_orders_after_failure
  after: failure
  capability_id: workorders.list
doc_refs:
- wa-field-work_order
- wa-field-technician
- wa-field-note
- wa-rule-work_order_open
- wa-rule-technician_assignable
- wa-rule-already_assigned
- wa-rule-note_length
- wa-perm-workorders.assign
- wa-failure-permission_denied
- wa-failure-scope_violation
- wa-failure-validation_failed
- wa-failure-conflict
- wa-failure-stale
- wa-failure-expired
- wa-failure-uncertain_outcome
- wa-failure-missing_fields
- wa-failure-unavailable
- wa-risk
- wa-confirmation
- wa-outcome-assigned
examples:
- id: en-assign-wo
  language: en
  test_only: true
  utterance: Assign WO-1001 to Marco Bianchi
  expected_fields:
    work_order: WO-1001
    technician: Marco Bianchi
- id: en-assign-chiller-note
  language: en
  test_only: true
  utterance: Give the chiller job to Paolo Neri and tell him it is urgent
  expected_fields:
    work_order: chiller
    technician: Paolo Neri
    note: it is urgent
- id: it-assegna-wo
  language: it
  test_only: true
  utterance: Assegna WO-1001 a Marco Bianchi
  expected_fields:
    work_order: WO-1001
    technician: Marco Bianchi
- id: it-assegna-refrigeratore
  language: it
  test_only: true
  utterance: Dai l'intervento sul chiller a Paolo Neri e digli che è urgente
  expected_fields:
    work_order: chiller
    technician: Paolo Neri
    note: è urgente
