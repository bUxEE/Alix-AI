id: workorders.list
version: 1.0.0
audience: user
title: List work orders
purpose: List the work orders of the caller's site that the caller may see, optionally filtered by status, priority, asset or technician, most urgent first. Read-only. A technician sees the work assigned to them and the work they raised; supervisors and auditors see the whole site.
scope_level: workspace
permissions:
- workorders.read
fields:
- name: status
  type: enum
  required: false
  description: Only list work orders in this status; any lists every status.
  values:
  - open
  - assigned
  - closed
  - any
  default:
    source: literal
    value: any
- name: priority
  type: enum
  required: false
  description: Only list work orders with this priority.
  values:
  - low
  - normal
  - high
  - urgent
- name: asset
  type: entity_ref
  entity_type: asset
  required: false
  description: Only list work orders of this asset.
- name: technician
  type: entity_ref
  entity_type: technician
  required: false
  description: Only list work orders assigned to this technician. A technician may name only themselves.
- name: max_results
  type: integer
  required: false
  description: How many work orders to list at most.
  minimum: 1
  maximum: 10
  default:
    source: literal
    value: 5
entity_types:
  asset:
    description: An asset of the site.
    resolve:
      endpoint: facility-api
      openapi_operation_id: resolveAsset
      result_schema: schemas/resolve.result.schema.json
  technician:
    description: A technician of the site, as the caller may see them.
    resolve:
      endpoint: facility-api
      openapi_operation_id: resolveTechnician
      result_schema: schemas/resolve.result.schema.json
ambiguity:
- id: asset_multiple
  field: asset
  when: multiple_matches
  action: ask_user
  max_choices: 5
- id: asset_none
  field: asset
  when: no_match
  action: reject
- id: technician_multiple
  field: technician
  when: multiple_matches
  action: ask_user
  max_choices: 5
- id: technician_none
  field: technician
  when: no_match
  action: reject
validation:
- id: max_results_in_range
  fields:
  - max_results
  description: The number of work orders must be a whole number from 1 to 10.
  error_code: validation_failed
- id: technician_filter_scope
  fields:
  - technician
  description: A technician may filter by their own name only; another technician's work is not available to them.
  error_code: scope_violation
failure_states:
- code: permission_denied
  description: The principal's role may not use this capability.
- code: scope_violation
  description: A record named is outside the principal's access (another site, another tenant, or work the role may not see), or does not exist. The application does not say which.
- code: validation_failed
  description: A value is missing, malformed or out of bounds. Nothing was changed.
- code: unavailable
  description: The application's data store cannot be reached. Nothing was changed.
effect_class: none
risk_level: 0
operations:
  read:
    endpoint: facility-api
    openapi_operation_id: listWorkOrders
    result_schema: schemas/workorders.list.result.schema.json
    timeout_ms: 5000
confirmation:
  mode: none
response_obligations:
- fact: search_status
  when: success
  description: The status filter that was applied.
- fact: work_order_count
  when: success
  description: How many work orders are listed.
- fact: work_order_summary
  when: success
  description: The work orders, each with its reference, title, priority, status and technician.
next_actions:
- id: assign_listed
  after: success
  capability_id: workorders.assign
- id: close_listed
  after: success
  capability_id: workorders.close
doc_refs:
- wl-field-status
- wl-field-priority
- wl-field-asset
- wl-field-technician
- wl-field-max_results
- wl-rule-max_results_in_range
- wl-rule-technician_filter_scope
- wl-perm-workorders.read
- wl-failure-permission_denied
- wl-failure-scope_violation
- wl-failure-validation_failed
- wl-failure-unavailable
- wl-risk
- wl-confirmation
- wl-outcome-work_orders_found
- wl-outcome-none_found
examples:
- id: en-open-orders
  language: en
  test_only: true
  utterance: Show me the open work orders
  expected_fields:
    status: open
- id: en-urgent-chiller
  language: en
  test_only: true
  utterance: List the urgent work orders for the chiller
  expected_fields:
    priority: urgent
    asset: chiller
- id: en-assigned-to
  language: en
  test_only: true
  utterance: What has been assigned to Marco Bianchi?
  expected_fields:
    status: assigned
    technician: Marco Bianchi
- id: it-ordini-aperti
  language: it
  test_only: true
  utterance: Mostra gli ordini di lavoro aperti
  expected_fields:
    status: open
- id: it-urgenti-refrigeratore
  language: it
  test_only: true
  utterance: Elenca gli interventi urgenti sul chiller
  expected_fields:
    priority: urgent
    asset: chiller
- id: it-assegnati-a
  language: it
  test_only: true
  utterance: Cosa è stato assegnato a Marco Bianchi?
  expected_fields:
    status: assigned
    technician: Marco Bianchi
