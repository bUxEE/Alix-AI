id: assets.decommission
version: 1.0.0
audience: user
title: Decommission an asset
purpose: 'Start the decommissioning of an asset of the caller''s site that has no open work orders. This is a level 3 action: the assistant can prepare it and show what it would do, but it can never complete it. The decommissioning is completed only by the supervisor in the Facility Maintenance application''s own authenticated interface, after a step-up check, using the reference this capability returns.'
scope_level: workspace
permissions:
- assets.decommission
fields:
- name: asset
  type: entity_ref
  entity_type: asset
  required: true
  description: The asset to decommission.
- name: reason
  type: string
  required: true
  description: Why the asset is being retired, for the record.
  min_length: 10
  max_length: 300
entity_types:
  asset:
    description: An asset of the site.
    resolve:
      endpoint: facility-api
      openapi_operation_id: resolveAsset
      result_schema: schemas/resolve.result.schema.json
ambiguity:
- id: asset_multiple
  field: asset
  when: multiple_matches
  action: ask_user
  max_choices: 5
- id: asset_none
  field: asset
  when: no_match
  action: reject
validation:
- id: asset_active
  fields:
  - asset
  description: The asset must still be active.
  error_code: conflict
- id: no_open_work_orders
  fields:
  - asset
  description: The asset must have no open or assigned work orders.
  error_code: conflict
- id: reason_length
  fields:
  - reason
  description: The reason must be 10 to 300 characters of plain text.
  error_code: validation_failed
failure_states:
- code: permission_denied
  description: The principal's role may not use this capability.
- code: scope_violation
  description: A record named is outside the principal's access (another site, another tenant, or work the role may not see), or does not exist. The application does not say which.
- code: validation_failed
  description: A value is missing, malformed or out of bounds. Nothing was changed.
- code: conflict
  description: A business rule is violated by the current state of the records. Nothing was changed.
- code: stale
  description: A record changed after the action was prepared, so the preparation is no longer valid. Nothing was changed; it can be prepared again.
- code: expired
  description: The prepared action was not confirmed in time, or was withdrawn. Nothing was changed.
- code: step_up_required
  description: The action must be completed in the application's own authenticated interface. The AI path never completes it, and nothing was changed.
- code: uncertain_outcome
  description: The commit response was lost. Whether the change was applied is established through the status operation before anything is retried.
- code: missing_fields
  description: A required field was not supplied. Nothing was changed.
- code: unavailable
  description: The application's data store cannot be reached. Nothing was changed.
effect_class: privileged
risk_level: 3
operations:
  validate:
    endpoint: facility-api
    openapi_operation_id: validateDecommissionAsset
    result_schema: schemas/assets.decommission.validation.result.schema.json
    timeout_ms: 5000
  prepare:
    endpoint: facility-api
    openapi_operation_id: prepareDecommissionAsset
    result_schema: schemas/assets.decommission.prepared.result.schema.json
    timeout_ms: 8000
  commit:
    endpoint: facility-api
    openapi_operation_id: commitDecommissionAsset
    result_schema: schemas/assets.decommission.receipt.result.schema.json
    timeout_ms: 15000
  status:
    endpoint: facility-api
    openapi_operation_id: statusDecommissionAsset
    result_schema: schemas/assets.decommission.receipt.result.schema.json
    timeout_ms: 5000
confirmation:
  mode: step_up
  step_up_channel: application_ui
prepared_action:
  ttl_seconds: 900
  invalidated_by:
  - record_revision
  - permission_change
  - user_change
idempotency:
  key_source: prepared_action_id
  window_seconds: 86400
  on_replay: return_original_receipt
response_obligations:
- fact: asset_name
  when: always
  description: The asset that would be decommissioned.
- fact: asset_tag
  when: prepared
  description: The tag of the asset.
- fact: step_up_reference
  when: prepared
  description: The reference of the step-up request the supervisor completes in the application.
next_actions:
- id: show_orders_blocking
  after: failure
  capability_id: workorders.list
doc_refs:
- ad-field-asset
- ad-field-reason
- ad-rule-asset_active
- ad-rule-no_open_work_orders
- ad-rule-reason_length
- ad-perm-assets.decommission
- ad-failure-permission_denied
- ad-failure-scope_violation
- ad-failure-validation_failed
- ad-failure-conflict
- ad-failure-stale
- ad-failure-expired
- ad-failure-step_up_required
- ad-failure-uncertain_outcome
- ad-failure-missing_fields
- ad-failure-unavailable
- ad-risk
- ad-confirmation
- ad-outcome-decommissioned
examples:
- id: en-retire-generator
  language: en
  test_only: true
  utterance: Decommission the backup generator, it was replaced last month
  expected_fields:
    asset: backup generator
    reason: It was replaced last month
- id: en-retire-by-tag
  language: en
  test_only: true
  utterance: Retire GEN-90, it is beyond economical repair
  expected_fields:
    asset: GEN-90
    reason: It is beyond economical repair
- id: it-dismetti-generatore
  language: it
  test_only: true
  utterance: Dismetti il Backup generator, è stato sostituito il mese scorso
  expected_fields:
    asset: Backup generator
    reason: È stato sostituito il mese scorso
- id: it-dismetti-per-sigla
  language: it
  test_only: true
  utterance: Dismetti il generatore GEN-90, non è più riparabile in modo economico
  expected_fields:
    asset: GEN-90
    reason: Non è più riparabile in modo economico
