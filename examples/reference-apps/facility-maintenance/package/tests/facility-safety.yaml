conversation_cases:
- id: create-asks-for-the-title
  language: en
  capability_id: workorders.create
  principal: tech-a1
  turns:
  - user: Raise a work order for the Backup generator
    expect:
      act: ask_missing
      missing_fields:
      - title
- id: assegna-chiede-il-tecnico
  language: it
  capability_id: workorders.assign
  principal: sup-a1
  turns:
  - user: Assegna l'ordine di lavoro del damper
    expect:
      act: ask_missing
      missing_fields:
      - technician
- id: close-by-reference
  language: en
  capability_id: workorders.close
  principal: sup-a1
  turns:
  - user: Close the damper work order, the damper was freed and lubricated
    expect:
      act: request_confirmation
- id: decommission-needs-the-app
  language: en
  capability_id: assets.decommission
  principal: sup-a1
  turns:
  - user: Decommission the Backup generator, it was replaced last month
    expect:
      act: request_step_up
smoke:
  paths:
  - id: smoke-text
    path: text
    principal: sup-a1
    capability_id: workorders.list
    utterance: Show me the open work orders
    expect:
      audit_events:
      - policy.decision
      - dialogue.turn
  - id: smoke-rag
    path: rag
    principal: tech-a1
    utterance: How often should the air handling unit filters be replaced?
    expect:
      audit_events:
      - rag.retrieved
      - dialogue.turn
      citations: true
  - id: smoke-rag-no-evidence
    path: rag
    principal: tech-a1
    utterance: What is the technician's home address?
    expect:
      audit_events:
      - rag.no_supported_evidence
      citations: false
  - id: smoke-action
    path: action
    principal: sup-a1
    capability_id: workorders.assign
    utterance: Assign the damper work order to Marco Bianchi
    expect:
      audit_events:
      - action.prepared
      - action.confirmed
      - action.committed
  verify_cleanup: true
