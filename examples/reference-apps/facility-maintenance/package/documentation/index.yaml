    anchor: failure-unavailable
  error_code: unavailable
- id: wa-risk
  capability_id: workorders.assign
  facet: risk_level
  language: en
  title: Risk level 2
  summary: 'Level 2 (consequential or external side effect): the change is prepared, its exact effects are shown and it is committed only after the user explicitly confirms. Effect class external.'
  location:
    path: documentation/workorders/assign.md
    anchor: level-2
- id: wa-confirmation
  capability_id: workorders.assign
  facet: confirmation_rule
  language: en
  title: Confirmation rule (explicit)
  summary: The user must confirm the exact prepared effects before anything is committed. The confirmation is bound to the preparation, the principal, the session and the data versions it relied on.
  location:
    path: documentation/workorders/assign.md
    anchor: confirmation-explicit
- id: wa-outcome-assigned
  capability_id: workorders.assign
  facet: user_visible_outcome
  language: en
  title: Outcome assigned
  summary: 'What the user is told when the outcome is assigned: Done. Work order {work_order_id} is assigned to {technician_name}. The technician was notified (reference {notification_reference}).'
  location:
    path: documentation/workorders/assign.md
    anchor: outcome-assigned
  outcome: assigned
- id: wx-field-work_order
  capability_id: workorders.close
  facet: field
  language: en
  title: Field work_order
  summary: Type entity_ref of work_order, required. The work order to close.
  location:
    path: documentation/workorders/close.md
    anchor: field-work_order
  field: work_order
- id: wx-field-resolution
  capability_id: workorders.close
  facet: field
  language: en
  title: Field resolution
  summary: Type string, required, length 3 to 500. What was done to resolve it, in the technician's words.
  location:
    path: documentation/workorders/close.md
    anchor: field-resolution
  field: resolution
- id: wx-field-parts_used
  capability_id: workorders.close
  facet: field
  language: en
  title: Field parts_used
  summary: Type list of string, optional, at most 20 items. The parts consumed, each written PART-NUMBER:QUANTITY, for example FLT-204:2. Leave it out when no parts were used.
  location:
    path: documentation/workorders/close.md
    anchor: field-parts_used
  field: parts_used
- id: wx-field-labor_hours
  capability_id: workorders.close
  facet: field
  language: en
  title: Field labor_hours
  summary: Type number, optional, from 0 to 24. The hours of labour spent, with at most two decimals. Leave it out when not recorded.
  location:
    path: documentation/workorders/close.md
    anchor: field-labor_hours
  field: labor_hours
- id: wx-rule-work_order_closable
  capability_id: workorders.close
  facet: validation_rule
  language: en
  title: Rule work_order_closable
  summary: The work order must not already be closed. Reported as conflict.
  location:
    path: documentation/workorders/close.md
    anchor: rule-work_order_closable
  rule_id: work_order_closable
- id: wx-rule-resolution_length
  capability_id: workorders.close
  facet: validation_rule
  language: en
  title: Rule resolution_length
  summary: The resolution must be 3 to 500 characters of plain text. Reported as validation_failed.
  location:
    path: documentation/workorders/close.md
    anchor: rule-resolution_length
  rule_id: resolution_length
- id: wx-rule-parts_format
  capability_id: workorders.close
  facet: validation_rule
  language: en
  title: Rule parts_format
  summary: Each part must be written PART-NUMBER:QUANTITY with a quantity of 1 to 999, and each part number may appear only once. Reported as validation_failed.
