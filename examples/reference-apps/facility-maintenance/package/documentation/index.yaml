    path: documentation/workorders/assign.md
    anchor: field-technician
  field: technician
- id: wa-field-note
  capability_id: workorders.assign
  facet: field
  language: en
  title: Field note
  summary: Type string, optional, length 0 to 200. A note for the technician, included in the notification. Optional free text.
  location:
    path: documentation/workorders/assign.md
    anchor: field-note
  field: note
- id: wa-rule-work_order_open
  capability_id: workorders.assign
  facet: validation_rule
  language: en
  title: Rule work_order_open
  summary: The work order must not be closed. Reported as conflict.
  location:
    path: documentation/workorders/assign.md
    anchor: rule-work_order_open
  rule_id: work_order_open
- id: wa-rule-technician_assignable
  capability_id: workorders.assign
  facet: validation_rule
  language: en
  title: Rule technician_assignable
  summary: The technician must be active and have fewer than 5 open work orders. Reported as conflict.
  location:
    path: documentation/workorders/assign.md
    anchor: rule-technician_assignable
  rule_id: technician_assignable
- id: wa-rule-already_assigned
  capability_id: workorders.assign
  facet: validation_rule
  language: en
  title: Rule already_assigned
  summary: The work order must not already be assigned to this technician. Reported as conflict.
  location:
    path: documentation/workorders/assign.md
    anchor: rule-already_assigned
  rule_id: already_assigned
- id: wa-rule-note_length
  capability_id: workorders.assign
  facet: validation_rule
  language: en
  title: Rule note_length
  summary: The note must be at most 200 characters of plain text. Reported as validation_failed.
  location:
    path: documentation/workorders/assign.md
    anchor: rule-note_length
  rule_id: note_length
- id: wa-perm-workorders.assign
  capability_id: workorders.assign
  facet: permission
  language: en
  title: Permission workorders.assign
  summary: Allows assigning technicians to the work orders of the caller's site. Granted to supervisor only; checked by the host on every call.
  location:
