entries:
- id: wl-field-status
  capability_id: workorders.list
  facet: field
  language: en
  title: Field status
  summary: Type enum (open, assigned, closed, any), optional, default any. Only list work orders in this status; any lists every status.
  location:
    path: documentation/workorders/list.md
    anchor: field-status
  field: status
- id: wl-field-priority
  capability_id: workorders.list
  facet: field
  language: en
  title: Field priority
  summary: Type enum (low, normal, high, urgent), optional. Only list work orders with this priority.
  location:
    path: documentation/workorders/list.md
    anchor: field-priority
  field: priority
- id: wl-field-asset
  capability_id: workorders.list
  facet: field
  language: en
  title: Field asset
  summary: Type entity_ref of asset, optional. Only list work orders of this asset.
  location:
    path: documentation/workorders/list.md
    anchor: field-asset
  field: asset
- id: wl-field-technician
  capability_id: workorders.list
  facet: field
  language: en
  title: Field technician
  summary: Type entity_ref of technician, optional. Only list work orders assigned to this technician. A technician may name only themselves.
  location:
    path: documentation/workorders/list.md
    anchor: field-technician
  field: technician
- id: wl-field-max_results
  capability_id: workorders.list
  facet: field
  language: en
  title: Field max_results
  summary: Type integer, optional, from 1 to 10, default 5. How many work orders to list at most.
  location:
    path: documentation/workorders/list.md
    anchor: field-max_results
  field: max_results
- id: wl-rule-max_results_in_range
  capability_id: workorders.list
  facet: validation_rule
  language: en
  title: Rule max_results_in_range
  summary: The number of work orders must be a whole number from 1 to 10. Reported as validation_failed.
  location:
    path: documentation/workorders/list.md
    anchor: rule-max_results_in_range
  rule_id: max_results_in_range
- id: wl-rule-technician_filter_scope
  capability_id: workorders.list
  facet: validation_rule
  language: en
  title: Rule technician_filter_scope
  summary: A technician may filter by their own name only; another technician's work is not available to them. Reported as scope_violation.
  location:
    path: documentation/workorders/list.md
    anchor: rule-technician_filter_scope
  rule_id: technician_filter_scope
- id: wl-perm-workorders.read
  capability_id: workorders.list
  facet: permission
  language: en
  title: Permission workorders.read
  summary: Allows listing work orders and resolving assets, technicians and work orders. Granted to technician, supervisor, auditor; checked by the host on every call, which also limits a technician to the work assigned to them or raised by them.
  location:
    path: documentation/workorders/list.md
    anchor: permission-workordersread
  permission: workorders.read
- id: wl-failure-permission_denied
  capability_id: workorders.list
  facet: failure_state
  language: en
  title: Failure permission_denied
  summary: The principal's role may not use this capability.
  location:
    path: documentation/workorders/list.md
    anchor: failure-permission_denied
  error_code: permission_denied
- id: wl-failure-scope_violation
  capability_id: workorders.list
  facet: failure_state
  language: en
  title: Failure scope_violation
  summary: A record named is outside the principal's access (another site, another tenant, or work the role may not see), or does not exist. The application does not say which.
  location:
    path: documentation/workorders/list.md
    anchor: failure-scope_violation
  error_code: scope_violation
- id: wl-failure-validation_failed
  capability_id: workorders.list
  facet: failure_state
  language: en
  title: Failure validation_failed
  summary: A value is missing, malformed or out of bounds. Nothing was changed.
  location:
    path: documentation/workorders/list.md
    anchor: failure-validation_failed
  error_code: validation_failed
- id: wl-failure-unavailable
  capability_id: workorders.list
  facet: failure_state
  language: en
  title: Failure unavailable
  summary: The application's data store cannot be reached. Nothing was changed.
  location:
    path: documentation/workorders/list.md
    anchor: failure-unavailable
  error_code: unavailable
- id: wl-risk
  capability_id: workorders.list
  facet: risk_level
  language: en
  title: Risk level 0
  summary: 'Level 0 (read-only, low sensitivity): executed after authorisation; nothing is prepared and nothing is committed. Effect class none.'
  location:
    path: documentation/workorders/list.md
    anchor: level-0
- id: wl-confirmation
  capability_id: workorders.list
  facet: confirmation_rule
  language: en
  title: Confirmation rule (none)
  summary: 'No separate confirmation is asked: the application commits right after the concise summary. The host still reauthorises the call and limits it to the caller''s own site.'
  location:
    path: documentation/workorders/list.md
    anchor: confirmation-none
- id: wl-outcome-work_orders_found
  capability_id: workorders.list
  facet: user_visible_outcome
  language: en
  title: Outcome work_orders_found
  summary: 'What the user is told when the outcome is work_orders_found: I found {work_order_count} work orders (status: {search_status}): {work_order_summary}.'
  location:
    path: documentation/workorders/list.md
    anchor: outcome-work_orders_found
  outcome: work_orders_found
- id: wl-outcome-none_found
  capability_id: workorders.list
  facet: user_visible_outcome
  language: en
  title: Outcome none_found
  summary: 'What the user is told when the outcome is none_found: I found no work orders (status: {search_status}). That is {work_order_count} results.'
  location:
    path: documentation/workorders/list.md
    anchor: outcome-none_found
  outcome: none_found
- id: wc-field-asset
  capability_id: workorders.create
  facet: field
  language: en
  title: Field asset
  summary: Type entity_ref of asset, required. The asset the work is for.
  location:
    path: documentation/workorders/create.md
    anchor: field-asset
  field: asset
- id: wc-field-title
  capability_id: workorders.create
  facet: field
  language: en
  title: Field title
  summary: Type string, required, length 5 to 120. A short statement of the problem or the job.
  location:
    path: documentation/workorders/create.md
    anchor: field-title
  field: title
- id: wc-field-description
  capability_id: workorders.create
  facet: field
  language: en
  title: Field description
  summary: Type string, optional, length 0 to 500. More detail about the problem, in the reporter's words. Optional free text.
  location:
    path: documentation/workorders/create.md
    anchor: field-description
  field: description
- id: wc-field-priority
  capability_id: workorders.create
  facet: field
  language: en
  title: Field priority
  summary: Type enum (low, normal, high, urgent), optional, default normal. How soon it must be dealt with. Defaults to normal.
  location:
    path: documentation/workorders/create.md
    anchor: field-priority
  field: priority
- id: wc-rule-title_length
  capability_id: workorders.create
  facet: validation_rule
  language: en
  title: Rule title_length
  summary: The title must be 5 to 120 characters of plain text. Reported as validation_failed.
  location:
    path: documentation/workorders/create.md
    anchor: rule-title_length
  rule_id: title_length
- id: wc-rule-asset_active
  capability_id: workorders.create
  facet: validation_rule
  language: en
  title: Rule asset_active
  summary: 'The asset must still be active: a decommissioned asset takes no new work. Reported as conflict.'
  location:
    path: documentation/workorders/create.md
    anchor: rule-asset_active
  rule_id: asset_active
- id: wc-rule-no_duplicate_open
  capability_id: workorders.create
  facet: validation_rule
  language: en
  title: Rule no_duplicate_open
  summary: The asset must not already have an open work order with the same title. Reported as conflict.
  location:
    path: documentation/workorders/create.md
    anchor: rule-no_duplicate_open
  rule_id: no_duplicate_open
- id: wc-perm-workorders.create
  capability_id: workorders.create
  facet: permission
  language: en
  title: Permission workorders.create
  summary: Allows raising work orders against the assets of the caller's site. Granted to technician and supervisor; checked by the host on every call.
  location:
    path: documentation/workorders/create.md
    anchor: permission-workorderscreate
  permission: workorders.create
- id: wc-failure-permission_denied
  capability_id: workorders.create
  facet: failure_state
  language: en
  title: Failure permission_denied
  summary: The principal's role may not use this capability.
  location:
    path: documentation/workorders/create.md
    anchor: failure-permission_denied
  error_code: permission_denied
- id: wc-failure-scope_violation
  capability_id: workorders.create
  facet: failure_state
  language: en
  title: Failure scope_violation
  summary: A record named is outside the principal's access (another site, another tenant, or work the role may not see), or does not exist. The application does not say which.
  location:
    path: documentation/workorders/create.md
    anchor: failure-scope_violation
  error_code: scope_violation
- id: wc-failure-validation_failed
  capability_id: workorders.create
  facet: failure_state
  language: en
  title: Failure validation_failed
  summary: A value is missing, malformed or out of bounds. Nothing was changed.
  location:
    path: documentation/workorders/create.md
    anchor: failure-validation_failed
  error_code: validation_failed
- id: wc-failure-conflict
  capability_id: workorders.create
  facet: failure_state
  language: en
  title: Failure conflict
  summary: A business rule is violated by the current state of the records. Nothing was changed.
  location:
    path: documentation/workorders/create.md
    anchor: failure-conflict
  error_code: conflict
- id: wc-failure-stale
  capability_id: workorders.create
  facet: failure_state
  language: en
  title: Failure stale
  summary: A record changed after the action was prepared, so the preparation is no longer valid. Nothing was changed; it can be prepared again.
  location:
    path: documentation/workorders/create.md
    anchor: failure-stale
  error_code: stale
- id: wc-failure-expired
  capability_id: workorders.create
  facet: failure_state
  language: en
  title: Failure expired
  summary: The prepared action was not confirmed in time, or was withdrawn. Nothing was changed.
  location:
    path: documentation/workorders/create.md
    anchor: failure-expired
  error_code: expired
- id: wc-failure-uncertain_outcome
  capability_id: workorders.create
  facet: failure_state
  language: en
  title: Failure uncertain_outcome
  summary: The commit response was lost. Whether the change was applied is established through the status operation before anything is retried.
  location:
    path: documentation/workorders/create.md
    anchor: failure-uncertain_outcome
  error_code: uncertain_outcome
- id: wc-failure-missing_fields
  capability_id: workorders.create
  facet: failure_state
  language: en
  title: Failure missing_fields
  summary: A required field was not supplied. Nothing was changed.
  location:
    path: documentation/workorders/create.md
    anchor: failure-missing_fields
  error_code: missing_fields
- id: wc-failure-unavailable
  capability_id: workorders.create
  facet: failure_state
  language: en
  title: Failure unavailable
  summary: The application's data store cannot be reached. Nothing was changed.
  location:
    path: documentation/workorders/create.md
    anchor: failure-unavailable
  error_code: unavailable
- id: wc-risk
  capability_id: workorders.create
  facet: risk_level
  language: en
  title: Risk level 1
  summary: 'Level 1 (reversible low-impact change): the application shows a concise summary and commits immediately; the change can be undone by a later work order action. Effect class reversible.'
  location:
    path: documentation/workorders/create.md
    anchor: level-1
- id: wc-confirmation
  capability_id: workorders.create
  facet: confirmation_rule
  language: en
  title: Confirmation rule (none)
  summary: 'No separate confirmation is asked: the application commits right after the concise summary. The host still reauthorises the call and limits it to the caller''s own site.'
  location:
    path: documentation/workorders/create.md
    anchor: confirmation-none
- id: wc-outcome-created
  capability_id: workorders.create
  facet: user_visible_outcome
  language: en
  title: Outcome created
  summary: 'What the user is told when the outcome is created: Done. Work order {work_order_id} was created for {asset_name}: {work_order_title}, priority {priority}.'
  location:
    path: documentation/workorders/create.md
    anchor: outcome-created
  outcome: created
- id: wa-field-work_order
  capability_id: workorders.assign
  facet: field
  language: en
  title: Field work_order
  summary: Type entity_ref of work_order, required. The work order to assign.
