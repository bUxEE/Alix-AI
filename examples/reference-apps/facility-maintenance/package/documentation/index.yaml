    path: documentation/workorders/assign.md
    anchor: field-work_order
  field: work_order
- id: wa-field-technician
  capability_id: workorders.assign
  facet: field
  language: en
  title: Field technician
  summary: Type entity_ref of technician, required. The technician who takes the work.
