capability_id: workorders.create
language: en
contract_version: 1.0.0
terminology:
- work_order
- asset
- priority
field_prompts:
- field: asset
  label: Asset
  prompt: Which asset is the work for? Name it or give its tag.
  examples:
  - AHU-200
- field: title
  label: Title
  prompt: What is the problem or the job? A short sentence is enough.
  examples:
  - Supply fan belt squeals at start-up
- field: description
  label: Details
  prompt: Anything else worth noting? You can skip this.
- field: priority
  label: Priority
  prompt: 'How urgent is it: low, normal, high or urgent? Normal if you do not say.'
  examples:
  - high
clarifications:
- rule_id: asset_multiple
  prompt: More than one asset matches {input.asset}. Which one do you mean?
corrections:
  acknowledgement: Okay, I have changed that.
  correctable_fields:
  - asset
  - title
  - description
  - priority
  prepared_action_invalidated: That changes the work order, so the earlier summary no longer applies. I will prepare it again with the new details.
cancellations:
  acknowledgement: Okay, I stopped. Nothing was created.
success:
- outcome: created
  text: 'Done. Work order {work_order_id} was created for {asset_name}: {work_order_title}, priority {priority}.'
failures:
- code: permission_denied
  text: You are not allowed to do that, so nothing was changed.
- code: scope_violation
  text: 'I cannot do that: the record is not available to you. Nothing was changed.'
- code: validation_failed
  text: 'I could not create that: the title must be 5 to 120 characters. Nothing was created.'
- code: conflict
  text: 'I could not create that: the asset is decommissioned, or it already has an open work order with this title. Nothing was created.'
- code: stale
  text: A record changed after I prepared this, so I did not apply it. Nothing was changed; I can prepare it again.
- code: expired
  text: This was not confirmed in time, or it was withdrawn, so nothing was changed.
- code: uncertain_outcome
  text: I could not confirm whether this was applied. I will check before doing anything else, so please do not ask for it again yet.
- code: missing_fields
  text: I still need a few details before I can do that. Nothing was changed.
- code: unavailable
  text: The maintenance system is not reachable right now, so nothing was changed.
next_actions:
- id: assign_new_order
  label: Assign this work order
