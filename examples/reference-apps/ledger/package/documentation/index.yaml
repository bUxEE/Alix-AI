entries:
  - id: "if-field-query"
    capability_id: "invoices.find"
    facet: "field"
    language: "en"
    title: "Field query"
    summary: "Type string, required, length 2 to 100. An invoice number such as INV-0007, an invoice identifier or part of a customer name."
    location:
      path: "documentation/invoices/find.md"
      anchor: "field-query"
    field: "query"
  - id: "if-field-status"
    capability_id: "invoices.find"
    facet: "field"
    language: "en"
    title: "Field status"
    summary: "Type enum, optional, one of issued, partially_paid, paid, void. Only list invoices in this state."
    location:
      path: "documentation/invoices/find.md"
      anchor: "field-status"
    field: "status"
  - id: "if-field-max_results"
    capability_id: "invoices.find"
    facet: "field"
    language: "en"
    title: "Field max_results"
    summary: "Type integer, optional, from 1 to 10, default 5. How many invoices to list at most."
    location:
      path: "documentation/invoices/find.md"
      anchor: "field-max_results"
    field: "max_results"
  - id: "if-rule-query_not_blank"
    capability_id: "invoices.find"
    facet: "validation_rule"
    language: "en"
    title: "Rule query_not_blank"
    summary: "The query must contain at least two characters that are not spaces. Reported as validation_failed."
    location:
      path: "documentation/invoices/find.md"
      anchor: "rule-query_not_blank"
    rule_id: "query_not_blank"
  - id: "if-perm-invoices.read"
    capability_id: "invoices.find"
    facet: "permission"
    language: "en"
    title: "Permission invoices.read"
    summary: "Allows finding invoices and resolving them by mention. Granted to accountant, manager, viewer; checked by the host on every call."
    location:
      path: "documentation/invoices/find.md"
      anchor: "permission-invoicesread"
    permission: "invoices.read"
  - id: "if-failure-permission_denied"
    capability_id: "invoices.find"
    facet: "failure_state"
    language: "en"
    title: "Failure permission_denied"
    summary: "The principal's role may not look up invoices."
    location:
      path: "documentation/invoices/find.md"
      anchor: "failure-permission_denied"
    error_code: "permission_denied"
  - id: "if-failure-scope_violation"
    capability_id: "invoices.find"
    facet: "failure_state"
    language: "en"
    title: "Failure scope_violation"
    summary: "The record is outside the principal's reach (another team without manager access, or another organisation), or does not exist. The application does not say which."
    location:
      path: "documentation/invoices/find.md"
      anchor: "failure-scope_violation"
    error_code: "scope_violation"
  - id: "if-failure-validation_failed"
    capability_id: "invoices.find"
    facet: "failure_state"
    language: "en"
    title: "Failure validation_failed"
    summary: "A value is malformed or breaks one of the rules above. Nothing was searched."
    location:
      path: "documentation/invoices/find.md"
      anchor: "failure-validation_failed"
    error_code: "validation_failed"
  - id: "if-failure-missing_fields"
    capability_id: "invoices.find"
    facet: "failure_state"
    language: "en"
    title: "Failure missing_fields"
    summary: "A required field (query) was not supplied. Nothing was searched."
    location:
      path: "documentation/invoices/find.md"
      anchor: "failure-missing_fields"
    error_code: "missing_fields"
  - id: "if-failure-unavailable"
    capability_id: "invoices.find"
    facet: "failure_state"
    language: "en"
    title: "Failure unavailable"
    summary: "The ledger cannot be reached. Nothing was searched."
    location:
      path: "documentation/invoices/find.md"
      anchor: "failure-unavailable"
    error_code: "unavailable"
  - id: "if-risk"
    capability_id: "invoices.find"
    facet: "risk_level"
    language: "en"
    title: "Risk level 0"
    summary: "Level 0 (read-only, low sensitivity): the read runs after authorisation. Effect class none."
    location:
      path: "documentation/invoices/find.md"
      anchor: "level-0"
  - id: "if-confirmation"
    capability_id: "invoices.find"
    facet: "confirmation_rule"
    language: "en"
    title: "Confirmation rule (none)"
    summary: "No confirmation: a read changes nothing."
    location:
      path: "documentation/invoices/find.md"
      anchor: "confirmation-none"
  - id: "if-outcome-found"
    capability_id: "invoices.find"
    facet: "user_visible_outcome"
    language: "en"
    title: "Outcome found"
    summary: "What the user is told when the outcome is found: I found {invoice_count} matching invoice(s): {invoice_summary}"
    location:
      path: "documentation/invoices/find.md"
      anchor: "outcome-found"
    outcome: "found"
  - id: "qd-field-customer"
    capability_id: "quotes.draft"
    facet: "field"
    language: "en"
    title: "Field customer"
    summary: "Type entity_ref of customer, required. The customer the quote is for, named by its name or identifier."
    location:
      path: "documentation/quotes/draft.md"
      anchor: "field-customer"
    field: "customer"
  - id: "qd-field-description"
    capability_id: "quotes.draft"
    facet: "field"
    language: "en"
    title: "Field description"
    summary: "Type string, required, length 3 to 200. What the quote is for."
    location:
      path: "documentation/quotes/draft.md"
      anchor: "field-description"
    field: "description"
  - id: "qd-field-amount_minor"
    capability_id: "quotes.draft"
    facet: "field"
    language: "en"
    title: "Field amount_minor"
    summary: "Type integer, required, from 1 to 100000000000000. The quoted amount as a whole number of minor units of the currency (cents for EUR, yen for JPY, fils for KWD). A fraction is refused, never rounded."
    location:
      path: "documentation/quotes/draft.md"
      anchor: "field-amount_minor"
    field: "amount_minor"
  - id: "qd-field-currency"
    capability_id: "quotes.draft"
    facet: "field"
    language: "en"
    title: "Field currency"
    summary: "Type enum, optional, one of CHF, EUR, GBP, JPY, KWD, USD. Must be the customer's own currency; when omitted it is the customer's."
    location:
      path: "documentation/quotes/draft.md"
      anchor: "field-currency"
    field: "currency"
  - id: "qd-field-valid_days"
    capability_id: "quotes.draft"
    facet: "field"
    language: "en"
    title: "Field valid_days"
    summary: "Type integer, optional, from 1 to 90, default 30. How many days the quote stays valid."
    location:
      path: "documentation/quotes/draft.md"
      anchor: "field-valid_days"
    field: "valid_days"
  - id: "qd-rule-description_present"
    capability_id: "quotes.draft"
    facet: "validation_rule"
    language: "en"
    title: "Rule description_present"
    summary: "The description needs at least three characters that are not spaces. Reported as validation_failed."
    location:
      path: "documentation/quotes/draft.md"
      anchor: "rule-description_present"
    rule_id: "description_present"
  - id: "qd-rule-amount_in_range"
    capability_id: "quotes.draft"
    facet: "validation_rule"
    language: "en"
    title: "Rule amount_in_range"
    summary: "The amount must be a whole number of minor units from 1 to 100000000000000. Reported as validation_failed."
    location:
      path: "documentation/quotes/draft.md"
      anchor: "rule-amount_in_range"
    rule_id: "amount_in_range"
  - id: "qd-rule-currency_matches_customer"
    capability_id: "quotes.draft"
    facet: "validation_rule"
    language: "en"
    title: "Rule currency_matches_customer"
    summary: "The currency must be the customer's own currency. Reported as validation_failed."
    location:
      path: "documentation/quotes/draft.md"
      anchor: "rule-currency_matches_customer"
    rule_id: "currency_matches_customer"
  - id: "qd-rule-valid_days_in_range"
    capability_id: "quotes.draft"
    facet: "validation_rule"
    language: "en"
    title: "Rule valid_days_in_range"
    summary: "The validity must be from 1 to 90 days. Reported as validation_failed."
    location:
      path: "documentation/quotes/draft.md"
      anchor: "rule-valid_days_in_range"
    rule_id: "valid_days_in_range"
  - id: "qd-perm-quotes.draft"
    capability_id: "quotes.draft"
    facet: "permission"
    language: "en"
    title: "Permission quotes.draft"
    summary: "Allows drafting a quote for a customer of the caller's team and resolving customers. Granted to accountant, manager; checked by the host on every call."
    location:
      path: "documentation/quotes/draft.md"
      anchor: "permission-quotesdraft"
    permission: "quotes.draft"
  - id: "qd-failure-permission_denied"
    capability_id: "quotes.draft"
    facet: "failure_state"
    language: "en"
    title: "Failure permission_denied"
    summary: "The principal's role may not draft a quote."
    location:
      path: "documentation/quotes/draft.md"
      anchor: "failure-permission_denied"
    error_code: "permission_denied"
  - id: "qd-failure-scope_violation"
    capability_id: "quotes.draft"
    facet: "failure_state"
    language: "en"
    title: "Failure scope_violation"
    summary: "The record is outside the principal's reach (another team without manager access, or another organisation), or does not exist. The application does not say which."
    location:
      path: "documentation/quotes/draft.md"
      anchor: "failure-scope_violation"
    error_code: "scope_violation"
  - id: "qd-failure-validation_failed"
    capability_id: "quotes.draft"
    facet: "failure_state"
    language: "en"
    title: "Failure validation_failed"
    summary: "A value is malformed or breaks one of the rules above. Nothing was changed."
    location:
      path: "documentation/quotes/draft.md"
      anchor: "failure-validation_failed"
    error_code: "validation_failed"
  - id: "qd-failure-missing_fields"
    capability_id: "quotes.draft"
    facet: "failure_state"
    language: "en"
    title: "Failure missing_fields"
    summary: "A required field (customer, description, amount_minor) was not supplied. Nothing was changed."
    location:
      path: "documentation/quotes/draft.md"
      anchor: "failure-missing_fields"
    error_code: "missing_fields"
  - id: "qd-failure-conflict"
    capability_id: "quotes.draft"
    facet: "failure_state"
    language: "en"
    title: "Failure conflict"
    summary: "The idempotency key was used for a different action. Nothing was changed."
    location:
      path: "documentation/quotes/draft.md"
      anchor: "failure-conflict"
    error_code: "conflict"
  - id: "qd-failure-stale"
    capability_id: "quotes.draft"
    facet: "failure_state"
    language: "en"
    title: "Failure stale"
    summary: "A record changed after the action was prepared, so the preparation is no longer valid. Nothing was changed; it can be prepared again."
    location:
      path: "documentation/quotes/draft.md"
      anchor: "failure-stale"
    error_code: "stale"
  - id: "qd-failure-expired"
    capability_id: "quotes.draft"
    facet: "failure_state"
    language: "en"
    title: "Failure expired"
    summary: "The prepared action was not confirmed in time, or was withdrawn. Nothing was changed."
    location:
      path: "documentation/quotes/draft.md"
      anchor: "failure-expired"
    error_code: "expired"
  - id: "qd-failure-uncertain_outcome"
    capability_id: "quotes.draft"
    facet: "failure_state"
    language: "en"
    title: "Failure uncertain_outcome"
    summary: "The commit response was lost. What was recorded is established through the status operation before anything is retried."
    location:
      path: "documentation/quotes/draft.md"
      anchor: "failure-uncertain_outcome"
    error_code: "uncertain_outcome"
  - id: "qd-failure-unavailable"
    capability_id: "quotes.draft"
    facet: "failure_state"
    language: "en"
    title: "Failure unavailable"
    summary: "The ledger cannot be reached. Nothing was changed."
    location:
      path: "documentation/quotes/draft.md"
      anchor: "failure-unavailable"
    error_code: "unavailable"
  - id: "qd-risk"
    capability_id: "quotes.draft"
    facet: "risk_level"
    language: "en"
    title: "Risk level 1"
    summary: "Level 1 (reversible, low impact): a concise summary is shown and the application allows an immediate commit. Effect class reversible: a draft quote can be discarded and bills nobody."
    location:
      path: "documentation/quotes/draft.md"
      anchor: "level-1"
  - id: "qd-confirmation"
    capability_id: "quotes.draft"
    facet: "confirmation_rule"
    language: "en"
    title: "Confirmation rule (none)"
    summary: "No separate confirmation: the application allows an immediate commit after the concise summary. The prepared draft is valid for 10 minutes and is invalidated early if the customer changes, or if the permissions or the user change."
    location:
      path: "documentation/quotes/draft.md"
      anchor: "confirmation-none"
  - id: "qd-outcome-drafted"
    capability_id: "quotes.draft"
    facet: "user_visible_outcome"
    language: "en"
    title: "Outcome drafted"
    summary: "What the user is told when the outcome is drafted: Done. Quote {quote_number} for {customer_name} of {quote_total} is drafted and valid until {quote_valid_until}."
    location:
      path: "documentation/quotes/draft.md"
      anchor: "outcome-drafted"
    outcome: "drafted"
  - id: "ii-field-quote"
    capability_id: "invoices.issue"
    facet: "field"
    language: "en"
    title: "Field quote"
    summary: "Type entity_ref of quote, required. The draft quote to invoice, named by its number, its identifier or the customer's name."
    location:
      path: "documentation/invoices/issue.md"
      anchor: "field-quote"
    field: "quote"
  - id: "ii-field-due_days"
    capability_id: "invoices.issue"
    facet: "field"
    language: "en"
    title: "Field due_days"
    summary: "Type integer, optional, from 0 to 120, default 30. How many days from today the invoice is due."
    location:
      path: "documentation/invoices/issue.md"
      anchor: "field-due_days"
    field: "due_days"
  - id: "ii-rule-quote_is_draft"
    capability_id: "invoices.issue"
    facet: "validation_rule"
    language: "en"
    title: "Rule quote_is_draft"
    summary: "The quote must still be a draft: a quote that was already invoiced cannot be invoiced again. Reported as conflict."
    location:
      path: "documentation/invoices/issue.md"
      anchor: "rule-quote_is_draft"
    rule_id: "quote_is_draft"
  - id: "ii-rule-quote_still_valid"
    capability_id: "invoices.issue"
    facet: "validation_rule"
    language: "en"
    title: "Rule quote_still_valid"
    summary: "The quote must not have passed its last valid day. Reported as validation_failed."
    location:
      path: "documentation/invoices/issue.md"
      anchor: "rule-quote_still_valid"
    rule_id: "quote_still_valid"
  - id: "ii-rule-due_days_in_range"
    capability_id: "invoices.issue"
    facet: "validation_rule"
    language: "en"
    title: "Rule due_days_in_range"
    summary: "The due period must be from 0 to 120 days. Reported as validation_failed."
    location:
      path: "documentation/invoices/issue.md"
      anchor: "rule-due_days_in_range"
    rule_id: "due_days_in_range"
  - id: "ii-perm-invoices.issue"
    capability_id: "invoices.issue"
    facet: "permission"
    language: "en"
    title: "Permission invoices.issue"
    summary: "Allows issuing an invoice from a draft quote of the caller's team and resolving quotes. Granted to accountant, manager; checked by the host on every call."
    location:
      path: "documentation/invoices/issue.md"
      anchor: "permission-invoicesissue"
    permission: "invoices.issue"
  - id: "ii-failure-permission_denied"
    capability_id: "invoices.issue"
    facet: "failure_state"
    language: "en"
    title: "Failure permission_denied"
    summary: "The principal's role may not issue an invoice."
    location:
      path: "documentation/invoices/issue.md"
      anchor: "failure-permission_denied"
    error_code: "permission_denied"
  - id: "ii-failure-scope_violation"
    capability_id: "invoices.issue"
    facet: "failure_state"
    language: "en"
    title: "Failure scope_violation"
    summary: "The record is outside the principal's reach (another team without manager access, or another organisation), or does not exist. The application does not say which."
    location:
      path: "documentation/invoices/issue.md"
      anchor: "failure-scope_violation"
    error_code: "scope_violation"
  - id: "ii-failure-validation_failed"
    capability_id: "invoices.issue"
    facet: "failure_state"
    language: "en"
    title: "Failure validation_failed"
    summary: "A value is malformed or breaks one of the rules above. Nothing was changed."
    location:
      path: "documentation/invoices/issue.md"
      anchor: "failure-validation_failed"
    error_code: "validation_failed"
  - id: "ii-failure-missing_fields"
    capability_id: "invoices.issue"
    facet: "failure_state"
    language: "en"
    title: "Failure missing_fields"
    summary: "A required field (quote) was not supplied. Nothing was changed."
    location:
      path: "documentation/invoices/issue.md"
      anchor: "failure-missing_fields"
    error_code: "missing_fields"
  - id: "ii-failure-conflict"
    capability_id: "invoices.issue"
    facet: "failure_state"
    language: "en"
    title: "Failure conflict"
    summary: "The quote was already invoiced. Nothing was changed."
    location:
      path: "documentation/invoices/issue.md"
      anchor: "failure-conflict"
    error_code: "conflict"
  - id: "ii-failure-stale"
    capability_id: "invoices.issue"
    facet: "failure_state"
    language: "en"
    title: "Failure stale"
    summary: "A record changed after the action was prepared, so the preparation is no longer valid. Nothing was changed; it can be prepared again."
    location:
      path: "documentation/invoices/issue.md"
      anchor: "failure-stale"
    error_code: "stale"
  - id: "ii-failure-expired"
    capability_id: "invoices.issue"
    facet: "failure_state"
    language: "en"
    title: "Failure expired"
    summary: "The prepared action was not confirmed in time, or was withdrawn. Nothing was changed."
    location:
      path: "documentation/invoices/issue.md"
      anchor: "failure-expired"
    error_code: "expired"
  - id: "ii-failure-uncertain_outcome"
    capability_id: "invoices.issue"
    facet: "failure_state"
    language: "en"
    title: "Failure uncertain_outcome"
    summary: "The commit response was lost. What was recorded is established through the status operation before anything is retried."
    location:
      path: "documentation/invoices/issue.md"
      anchor: "failure-uncertain_outcome"
    error_code: "uncertain_outcome"
  - id: "ii-failure-unavailable"
    capability_id: "invoices.issue"
    facet: "failure_state"
    language: "en"
    title: "Failure unavailable"
    summary: "The ledger cannot be reached. Nothing was changed."
    location:
      path: "documentation/invoices/issue.md"
      anchor: "failure-unavailable"
    error_code: "unavailable"
  - id: "ii-risk"
    capability_id: "invoices.issue"
    facet: "risk_level"
    language: "en"
    title: "Risk level 2"
    summary: "Level 2 (consequential or external side effect): the action is prepared, its exact effects are shown, and it is committed only after explicit confirmation. Effect class external: the customer is sent an invoice."
    location:
      path: "documentation/invoices/issue.md"
      anchor: "level-2"
  - id: "ii-confirmation"
    capability_id: "invoices.issue"
    facet: "confirmation_rule"
    language: "en"
    title: "Confirmation rule (explicit)"
    summary: "The user must confirm the exact prepared invoice before it is committed. A prepared action is valid for 10 minutes and is invalidated early if the record changes, if the permissions or the user change, or if the ledger signs an event about it."
    location:
      path: "documentation/invoices/issue.md"
      anchor: "confirmation-explicit"
  - id: "ii-outcome-issued"
    capability_id: "invoices.issue"
    facet: "user_visible_outcome"
    language: "en"
    title: "Outcome issued"
    summary: "What the user is told when the outcome is issued: Done. Invoice {invoice_number} for {customer_name} of {invoice_total} is issued from quote {quote_number} and due on {invoice_due_on}."
    location:
      path: "documentation/invoices/issue.md"
      anchor: "outcome-issued"
    outcome: "issued"
  - id: "pr-field-invoice"
    capability_id: "payments.record"
    facet: "field"
    language: "en"
    title: "Field invoice"
    summary: "Type entity_ref of invoice, required. The invoice that was paid, named by its number, its identifier or the customer's name."
    location:
      path: "documentation/payments/record.md"
      anchor: "field-invoice"
    field: "invoice"
  - id: "pr-field-amount_minor"
    capability_id: "payments.record"
    facet: "field"
    language: "en"
    title: "Field amount_minor"
    summary: "Type integer, required, from 1 to 100000000000000. The amount received as a whole number of minor units of the invoice's currency. A fraction is refused, never rounded."
    location:
      path: "documentation/payments/record.md"
      anchor: "field-amount_minor"
    field: "amount_minor"
  - id: "pr-field-currency"
    capability_id: "payments.record"
    facet: "field"
    language: "en"
    title: "Field currency"
    summary: "Type enum, optional, one of CHF, EUR, GBP, JPY, KWD, USD. Must be the invoice's own currency; when omitted it is the invoice's."
    location:
      path: "documentation/payments/record.md"
      anchor: "field-currency"
    field: "currency"
  - id: "pr-field-paid_on"
    capability_id: "payments.record"
    facet: "field"
    language: "en"
    title: "Field paid_on"
    summary: "Type date, optional. The date the money was received, from the invoice date to today. When omitted it is today in the ledger's time (UTC)."
    location:
      path: "documentation/payments/record.md"
      anchor: "field-paid_on"
    field: "paid_on"
  - id: "pr-field-method"
    capability_id: "payments.record"
    facet: "field"
    language: "en"
    title: "Field method"
    summary: "Type enum, optional, one of bank_transfer, card, cash, default bank_transfer. How the money was received."
    location:
      path: "documentation/payments/record.md"
      anchor: "field-method"
    field: "method"
  - id: "pr-rule-invoice_open"
    capability_id: "payments.record"
    facet: "validation_rule"
    language: "en"
    title: "Rule invoice_open"
    summary: "The invoice must be issued or partially paid: a paid or void invoice takes no payment. Reported as conflict."
    location:
      path: "documentation/payments/record.md"
      anchor: "rule-invoice_open"
    rule_id: "invoice_open"
  - id: "pr-rule-amount_in_range"
    capability_id: "payments.record"
    facet: "validation_rule"
    language: "en"
    title: "Rule amount_in_range"
    summary: "The amount must be a whole number of minor units from 1 to 100000000000000. Reported as validation_failed."
    location:
      path: "documentation/payments/record.md"
      anchor: "rule-amount_in_range"
    rule_id: "amount_in_range"
  - id: "pr-rule-currency_matches_invoice"
    capability_id: "payments.record"
    facet: "validation_rule"
    language: "en"
    title: "Rule currency_matches_invoice"
    summary: "The currency must be the invoice's currency. Reported as validation_failed."
    location:
      path: "documentation/payments/record.md"
      anchor: "rule-currency_matches_invoice"
    rule_id: "currency_matches_invoice"
  - id: "pr-rule-amount_within_balance"
    capability_id: "payments.record"
    facet: "validation_rule"
    language: "en"
    title: "Rule amount_within_balance"
    summary: "The payment cannot be more than the balance still to pay. Reported as validation_failed."
    location:
