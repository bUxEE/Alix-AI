capability_id: "quotes.draft"
language: "en"
contract_version: "1.0.0"
terminology:
  - "quote"
  - "customer"
field_prompts:
  - field: "customer"
    label: "Customer"
    prompt: "Which customer is the quote for?"
    examples:
      - "Acme Srl"
  - field: "description"
    label: "Description"
    prompt: "What is the quote for?"
    examples:
      - "Annual support contract"
  - field: "amount_minor"
    label: "Amount in minor units"
    prompt: "What is the amount? Give it in minor units of the currency, for example 125050 for 1250.50 EUR."
    examples:
      - "125050"
  - field: "currency"
    label: "Currency"
    prompt: "Which currency? It must be the customer's own."
  - field: "valid_days"
    label: "Validity in days"
    prompt: "How many days should the quote stay valid?"
clarifications:
  - rule_id: "customer_multiple"
    prompt: "More than one customer matches {input.customer}. Which one do you mean?"
corrections:
  acknowledgement: "Okay, I have changed that."
  correctable_fields:
    - "customer"
    - "description"
    - "amount_minor"
    - "currency"
    - "valid_days"
  prepared_action_invalidated: "That changes the quote, so the earlier summary no longer applies. I will prepare it again."
cancellations:
  acknowledgement: "Okay, I stopped. No quote was drafted."
success:
  - outcome: "drafted"
    text: "Done. Quote {quote_number} for {customer_name} of {quote_total} is drafted and valid until {quote_valid_until}."
failures:
  - code: "permission_denied"
    text: "You are not allowed to draft quotes, so nothing was changed."
  - code: "scope_violation"
    text: "I cannot draft that: the customer is not available to you. Nothing was changed."
  - code: "validation_failed"
    text: "I could not draft that: the amount, the currency or the validity breaks a rule (the currency must be the customer's). Nothing was changed."
  - code: "missing_fields"
    text: "I still need the customer, a description and an amount to draft the quote. Nothing was changed."
  - code: "conflict"
    text: "That request clashes with something already recorded, so nothing was changed."
  - code: "stale"
    text: "The customer changed while I was preparing this, so I did not draft the quote. Nothing was changed; I can prepare it again."
  - code: "expired"
    text: "That was not confirmed in time, or it was withdrawn, so nothing was changed."
  - code: "uncertain_outcome"
    text: "I could not confirm whether it went through. I will check before doing anything else, so please do not ask for it again yet."
  - code: "unavailable"
    text: "The ledger is not reachable right now, so nothing was changed."
next_actions:
  - id: "issue_invoice"
    label: "Issue an invoice from this quote"
