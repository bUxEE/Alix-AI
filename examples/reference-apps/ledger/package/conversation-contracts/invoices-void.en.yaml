capability_id: "invoices.void"
language: "en"
contract_version: "1.0.0"
terminology:
  - "invoice"
  - "void_reference"
  - "customer"
field_prompts:
  - field: "invoice"
    label: "Invoice"
    prompt: "Which invoice should be voided? Give me its number or the customer's name."
    examples:
      - "INV-0001"
  - field: "reason"
    label: "Reason"
    prompt: "Why is it voided: duplicate, wrong amount, customer cancelled, or something else?"
clarifications:
  - rule_id: "invoice_multiple"
    prompt: "More than one invoice matches {input.invoice}. Which one do you mean?"
corrections:
  acknowledgement: "Okay, I have changed that."
  correctable_fields:
    - "invoice"
    - "reason"
  prepared_action_invalidated: "That changes which invoice is voided, so the earlier summary no longer applies. I will prepare it again."
cancellations:
  acknowledgement: "Okay, I stopped. Nothing was voided."
confirmations:
  request: "Voiding invoice {invoice_number} for {customer_name} of {invoice_total} is permanent. It must be finished in the ledger application with reference {void_reference}. Do you want to start it?"
  declined: "Understood. The invoice was not touched."
  expired: "That void request expired, so nothing was voided. I can prepare it again if you like."
  step_up_required: "I cannot void an invoice myself. Open the ledger application, sign in as a manager and finish it with reference {void_reference}, for invoice {invoice_number}."
success:
  - outcome: "voided"
    text: "Done. Invoice {invoice_number} is void, finished in the ledger application with reference {void_reference}."
failures:
  - code: "permission_denied"
    text: "You are not allowed to void invoices, so nothing was voided."
  - code: "scope_violation"
    text: "I cannot void that: the invoice is not available to you. Nothing was voided."
  - code: "validation_failed"
    text: "I could not void that: a value is not valid. Nothing was voided."
  - code: "missing_fields"
    text: "I still need to know which invoice to void and why. Nothing was voided."
  - code: "conflict"
    text: "That invoice cannot be voided: it is already void or it has payments. Nothing was voided."
  - code: "stale"
    text: "The invoice changed after I prepared this, so I did not void it. Nothing was voided; I can prepare it again."
  - code: "expired"
    text: "That was not confirmed in time, or it was withdrawn, so nothing was voided."
  - code: "uncertain_outcome"
    text: "I could not confirm whether it went through. I will check before doing anything else, so please do not ask for it again yet."
  - code: "step_up_required"
    text: "This can only be completed in the ledger application, so nothing was voided."
  - code: "unavailable"
    text: "The ledger is not reachable right now, so nothing was voided."
next_actions: []
