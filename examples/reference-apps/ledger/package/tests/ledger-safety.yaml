conversation_cases:
  - id: "record-payment-asks-for-the-amount"
    language: "en"
    capability_id: "payments.record"
    principal: "acct-a-north"
    turns:
      - user: "Record a payment on invoice INV-0001"
        expect:
          act: "ask_missing"
          missing_fields:
            - "amount_minor"
      - user: "10000 euro cents, by card"
        expect:
          act: "request_confirmation"
  - id: "fattura-chiede-il-preventivo"
    language: "it"
    capability_id: "invoices.issue"
    principal: "acct-a-north"
    turns:
      - user: "Emetti una fattura"
        expect:
          act: "ask_missing"
          missing_fields:
            - "quote"
  - id: "void-needs-the-application"
    language: "en"
    capability_id: "invoices.void"
    principal: "mgr-a-north"
    turns:
      - user: "Void invoice INV-0001, it is a duplicate"
        expect:
          act: "request_step_up"
  - id: "cerca-senza-chiave"
    language: "it"
    capability_id: "invoices.find"
    principal: "view-a-north"
    turns:
      - user: "Cerca una fattura"
        expect:
          act: "ask_missing"
          missing_fields:
            - "query"
smoke:
  paths:
    - id: "smoke-text"
      path: "text"
      principal: "view-a-north"
      capability_id: "invoices.find"
      utterance: "Show me invoice INV-0001"
      expect:
        audit_events:
          - "policy.decision"
          - "dialogue.turn"
    - id: "smoke-rag"
      path: "rag"
      principal: "acct-a-north"
      utterance: "When is payment due under the master services agreement?"
      expect:
        audit_events:
          - "rag.retrieved"
          - "dialogue.turn"
        citations: true
    - id: "smoke-rag-no-evidence"
      path: "rag"
      principal: "acct-a-north"
      utterance: "What is the home address of the customer's director?"
      expect:
        audit_events:
          - "rag.no_supported_evidence"
        citations: false
    - id: "smoke-action"
      path: "action"
      principal: "acct-a-north"
      capability_id: "payments.record"
      utterance: "Record a payment of 100.00 euro on invoice INV-0001"
      expect:
        audit_events:
          - "action.prepared"
          - "action.confirmed"
          - "action.committed"
  verify_cleanup: true
