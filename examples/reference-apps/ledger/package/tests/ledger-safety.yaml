suite: "ledger-safety"
description: "Scope isolation, safe execution and a runtime smoke test for the synthetic ledger application, run against disposable organisations with synthetic data, reached through the native bridge."
synthetic: true
fixtures:
  provisioning:
    create_tenant:
      endpoint: "ledger-bridge"
      native_method: "create_tenant"
    seed:
      endpoint: "ledger-bridge"
      native_method: "seed"
    cleanup:
      endpoint: "ledger-bridge"
      native_method: "cleanup"
    seed_data: "tests/seed/ledger.json"
  tenants:
    - ref: "org-a"
      workspaces:
        - "north-a"
        - "south-a"
    - ref: "org-b"
      workspaces:
        - "main-b"
  principals:
    - ref: "acct-a-north"
      tenant: "org-a"
      workspace: "north-a"
      kind: "human"
      roles:
        - "accountant"
    - ref: "mgr-a-north"
      tenant: "org-a"
      workspace: "north-a"
      kind: "human"
      roles:
        - "manager"
    - ref: "view-a-north"
      tenant: "org-a"
      workspace: "north-a"
      kind: "human"
      roles:
        - "viewer"
    - ref: "acct-a-south"
      tenant: "org-a"
      workspace: "south-a"
      kind: "human"
      roles:
        - "accountant"
    - ref: "acct-b"
      tenant: "org-b"
      workspace: "main-b"
      kind: "human"
      roles:
        - "accountant"
    - ref: "mgr-b"
      tenant: "org-b"
      workspace: "main-b"
      kind: "human"
      roles:
        - "manager"
  records:
    - ref: "cust-a-north"
      entity_type: "customer"
      tenant: "org-a"
      workspace: "north-a"
    - ref: "cust-a-south"
      entity_type: "customer"
      tenant: "org-a"
      workspace: "south-a"
    - ref: "cust-b"
      entity_type: "customer"
      tenant: "org-b"
      workspace: "main-b"
    - ref: "quote-a-north"
      entity_type: "quote"
      tenant: "org-a"
      workspace: "north-a"
    - ref: "quote-a-south"
      entity_type: "quote"
      tenant: "org-a"
      workspace: "south-a"
    - ref: "quote-b"
      entity_type: "quote"
      tenant: "org-b"
      workspace: "main-b"
    - ref: "inv-a-north"
      entity_type: "invoice"
      tenant: "org-a"
      workspace: "north-a"
    - ref: "inv-a-south"
      entity_type: "invoice"
      tenant: "org-a"
      workspace: "south-a"
    - ref: "inv-b"
      entity_type: "invoice"
      tenant: "org-b"
      workspace: "main-b"
scope_probes:
  - id: "viewer-finds-own-team-invoice"
    dimension: "record"
    operation: "read"
    capability_id: "invoices.find"
    principal: "view-a-north"
    target_record: "inv-a-north"
    expect: "allow"
  - id: "viewer-cannot-find-other-team-invoice"
    dimension: "workspace"
    operation: "read"
    capability_id: "invoices.find"
    principal: "view-a-north"
    target_record: "inv-a-south"
    expect: "deny"
    error_code: "scope_violation"
  - id: "accountant-cannot-find-other-team-invoice"
    dimension: "workspace"
    operation: "read"
    capability_id: "invoices.find"
    principal: "acct-a-north"
    target_record: "inv-a-south"
    expect: "deny"
    error_code: "scope_violation"
  - id: "manager-finds-other-team-invoice"
    dimension: "role"
    operation: "read"
    capability_id: "invoices.find"
    principal: "mgr-a-north"
    target_record: "inv-a-south"
    expect: "allow"
  - id: "other-organisation-cannot-find-invoice"
    dimension: "tenant"
    operation: "read"
    capability_id: "invoices.find"
    principal: "acct-b"
    target_record: "inv-a-north"
    expect: "deny"
    error_code: "scope_violation"
  - id: "accountant-drafts-for-own-customer"
    dimension: "record"
    operation: "prepare"
    capability_id: "quotes.draft"
    principal: "acct-a-north"
    target_record: "cust-a-north"
    expect: "allow"
  - id: "accountant-cannot-draft-for-other-team-customer"
    dimension: "workspace"
    operation: "prepare"
    capability_id: "quotes.draft"
    principal: "acct-a-north"
    target_record: "cust-a-south"
    expect: "deny"
    error_code: "scope_violation"
  - id: "other-organisation-cannot-draft-for-customer"
    dimension: "tenant"
    operation: "prepare"
    capability_id: "quotes.draft"
    principal: "acct-b"
    target_record: "cust-a-north"
    expect: "deny"
    error_code: "scope_violation"
  - id: "viewer-cannot-draft-a-quote"
    dimension: "role"
    operation: "prepare"
    capability_id: "quotes.draft"
    principal: "view-a-north"
    target_record: "cust-a-north"
    expect: "deny"
    error_code: "permission_denied"
  - id: "accountant-issues-own-quote"
    dimension: "record"
    operation: "prepare"
    capability_id: "invoices.issue"
    principal: "acct-a-north"
    target_record: "quote-a-north"
    expect: "allow"
  - id: "accountant-cannot-issue-other-team-quote"
    dimension: "workspace"
    operation: "prepare"
    capability_id: "invoices.issue"
    principal: "acct-a-north"
    target_record: "quote-a-south"
    expect: "deny"
    error_code: "scope_violation"
  - id: "other-organisation-cannot-issue-quote"
    dimension: "tenant"
    operation: "prepare"
    capability_id: "invoices.issue"
    principal: "acct-b"
    target_record: "quote-a-north"
    expect: "deny"
    error_code: "scope_violation"
  - id: "viewer-cannot-issue-an-invoice"
    dimension: "role"
    operation: "prepare"
    capability_id: "invoices.issue"
    principal: "view-a-north"
    target_record: "quote-a-north"
    expect: "deny"
    error_code: "permission_denied"
  - id: "accountant-records-payment-on-own-invoice"
    dimension: "record"
    operation: "prepare"
    capability_id: "payments.record"
    principal: "acct-a-north"
    target_record: "inv-a-north"
    expect: "allow"
  - id: "accountant-cannot-record-payment-on-other-team-invoice"
    dimension: "workspace"
    operation: "prepare"
    capability_id: "payments.record"
    principal: "acct-a-north"
    target_record: "inv-a-south"
    expect: "deny"
    error_code: "scope_violation"
  - id: "manager-cannot-record-payment-on-other-team-invoice"
    dimension: "workspace"
    operation: "prepare"
    capability_id: "payments.record"
    principal: "mgr-a-north"
    target_record: "inv-a-south"
    expect: "deny"
    error_code: "scope_violation"
  - id: "viewer-cannot-record-a-payment"
    dimension: "role"
    operation: "prepare"
    capability_id: "payments.record"
    principal: "view-a-north"
    target_record: "inv-a-north"
    expect: "deny"
    error_code: "permission_denied"
  - id: "manager-voids-own-team-invoice"
    dimension: "record"
    operation: "prepare"
    capability_id: "invoices.void"
    principal: "mgr-a-north"
    target_record: "inv-a-north"
    expect: "allow"
  - id: "manager-voids-other-team-invoice"
    dimension: "workspace"
    operation: "prepare"
    capability_id: "invoices.void"
    principal: "mgr-a-north"
    target_record: "inv-a-south"
    expect: "allow"
  - id: "accountant-cannot-void-an-invoice"
    dimension: "role"
    operation: "prepare"
    capability_id: "invoices.void"
    principal: "acct-a-north"
    target_record: "inv-a-north"
    expect: "deny"
    error_code: "permission_denied"
  - id: "other-organisation-manager-cannot-void"
    dimension: "tenant"
    operation: "prepare"
    capability_id: "invoices.void"
    principal: "mgr-b"
    target_record: "inv-a-north"
    expect: "deny"
    error_code: "scope_violation"
  - id: "accountant-retrieves-contracts"
    dimension: "source"
    operation: "retrieve"
    principal: "acct-a-north"
    target_source: "ledger-contracts"
    expect: "allow"
  - id: "viewer-retrieves-contracts"
    dimension: "source"
    operation: "retrieve"
    principal: "view-a-north"
    target_source: "ledger-contracts"
    expect: "allow"
safety_probes:
  - id: "quote-confirmed"
    capability_id: "quotes.draft"
    principal: "acct-a-north"
    kind: "confirmed_commit"
    expect:
      outcome: "committed_once"
  - id: "quote-unconfirmed"
    capability_id: "quotes.draft"
    principal: "acct-a-north"
    kind: "unconfirmed_commit"
    expect:
      outcome: "committed_once"
  - id: "quote-replayed"
    capability_id: "quotes.draft"
    principal: "acct-a-north"
    kind: "replayed_commit"
    expect:
      outcome: "original_receipt_returned"
  - id: "quote-expired"
    capability_id: "quotes.draft"
    principal: "acct-a-north"
    kind: "expired_preparation"
    expect:
      outcome: "rejected_no_effect"
      error_code: "expired"
  - id: "quote-record-changed-between-prepare-and-commit"
    capability_id: "quotes.draft"
    principal: "acct-a-north"
    kind: "stale_record"
    expect:
      outcome: "rejected_no_effect"
      error_code: "stale"
  - id: "quote-withdrawn"
    capability_id: "quotes.draft"
    principal: "acct-a-north"
    kind: "cancelled_preparation"
    expect:
      outcome: "rejected_no_effect"
      error_code: "conflict"
  - id: "quote-uncertain"
    capability_id: "quotes.draft"
    principal: "acct-a-north"
    kind: "uncertain_commit_recovery"
    expect:
      outcome: "recovered_via_status"
  - id: "issue-confirmed"
    capability_id: "invoices.issue"
    principal: "acct-a-north"
    kind: "confirmed_commit"
    expect:
      outcome: "committed_once"
  - id: "issue-unconfirmed"
    capability_id: "invoices.issue"
    principal: "acct-a-north"
    kind: "unconfirmed_commit"
    expect:
      outcome: "rejected_no_effect"
