suite: core-safety
description: Scope isolation and a runtime smoke test for the help-assistant fixture, run against a disposable tenant with synthetic data.
synthetic: true
fixtures:
  provisioning:
    create_tenant:
      endpoint: help-api
      openapi_operation_id: createTenant
    seed:
      endpoint: help-api
      openapi_operation_id: seedTenant
    cleanup:
      endpoint: help-api
      openapi_operation_id: cleanupTenant
    seed_data: tests/seed/help.json
  tenants:
  - ref: org-a
    workspaces:
    - product-1
    - product-2
  - ref: org-b
    workspaces:
    - product-1
  principals:
  - ref: user-a1
    tenant: org-a
    workspace: product-1
    kind: human
    roles:
    - user
  - ref: user-a2
    tenant: org-a
    workspace: product-2
    kind: human
    roles:
    - user
  - ref: guest-b1
    tenant: org-b
    workspace: product-1
    kind: human
    roles:
    - guest
  records:
  - ref: faq-password
    entity_type: faq_entry
    tenant: org-a
    workspace: product-1
  - ref: faq-export
    entity_type: faq_entry
    tenant: org-a
    workspace: product-1
scope_probes:
- id: user-asks-help
  dimension: role
  operation: read
  capability_id: help.overview
  principal: user-a1
  expect: allow
- id: guest-cannot-ask-help
  dimension: role
  operation: read
  capability_id: help.overview
  principal: guest-b1
  expect: deny
  error_code: permission_denied
- id: user-retrieves-faq
  dimension: source
  operation: retrieve
  principal: user-a1
  target_source: product-faq
  expect: allow
safety_probes: []
conversation_cases:
- id: help-missing-topic
  language: en
  capability_id: help.overview
  principal: user-a1
  turns:
  - user: Can you help me?
    expect:
      act: ask_missing
      missing_fields:
      - topic
  - user: Reset password
    expect:
      act: report_outcome
      fields:
        topic: Reset password
- id: aiuto-senza-argomento
  language: it
  capability_id: help.overview
  principal: user-a1
  turns:
  - user: Puoi aiutarmi?
    expect:
      act: ask_missing
      missing_fields:
      - topic
smoke:
  paths:
  - id: smoke-text
    path: text
    principal: user-a1
    capability_id: help.overview
    utterance: How do I reset my password?
    expect:
      audit_events:
      - turn.completed
  - id: smoke-rag
    path: rag
    principal: user-a1
    utterance: How do I reset my password?
    expect:
      audit_events:
      - rag.retrieved
      - turn.completed
      citations: true
  - id: smoke-rag-no-evidence
    path: rag
    principal: user-a1
    utterance: What is the CEO home address?
    expect:
      audit_events:
      - rag.no_supported_evidence
      citations: false
  verify_cleanup: true
